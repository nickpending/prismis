name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs the SAME gate as local: `.specify/verify.sh`. Not a reimplementation of its
# checks — the script itself, so the two can never disagree about what "green" means.
#
# The install step walks the same self-discovery verify.sh does (`find` for
# pyproject.toml and go.mod, with the same exclusions) rather than hand-listing
# [daemon, cli, tui]. A hand-maintained enumeration silently omits a unit: this repo
# already lost twelve daemon test files to a gap like that, and they sat unexecuted long
# enough for the code to drift out from under them. A unit added later is gated here
# automatically, with no list to keep in step.
#
# One job, not one per language: verify.sh runs every unit in a single invocation, so the
# runner needs uv, Python and Go all present at once.
jobs:
  verify:
    name: verify (ruff + pyright + pytest + go vet/test/staticcheck, every unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # daemon pulls sentence-transformers (and therefore torch), so a cold resolve
          # is expensive. Key on the lockfiles that determine the resolution.
          cache-dependency-glob: "**/uv.lock"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Install staticcheck
        # verify.sh:73 branches on `command -v staticcheck` and silently drops the check
        # where the binary is absent. Without this the job would gate on strictly less
        # than a local run while still reporting PASS.
        #
        # Pinned, not @latest: a floating version makes the gate's result depend on when
        # it ran rather than on the code, which is the ambient-dependence this repo's
        # verification exists to remove. v0.8.1 is what the local toolchain pins, so
        # local and CI judge the same code by the same rules. Bump deliberately.
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Install every unit's dependencies
        # verify.sh assumes dependencies are already present; these two loops mirror its
        # own discovery at verify.sh:61-63 and verify.sh:79.
        run: |
          set -euo pipefail
          while IFS= read -r pp; do
            dir="$(dirname "$pp")"
            echo "--- uv sync in ${dir#./}"
            (cd "$dir" && uv sync --frozen)
          done < <(find . -name pyproject.toml \
                     -not -path '*/.venv/*' -not -path '*/node_modules/*' \
                     -not -path '*/build/*' -not -path '*/dist/*' | sort)
          while IFS= read -r gm; do
            dir="$(dirname "$gm")"
            echo "--- go mod download in ${dir#./}"
            (cd "$dir" && go mod download)
          done < <(find . -name go.mod -not -path '*/vendor/*' | sort)

      - name: Verify
        # The gate's own contract treats an uncovered check as a notice, not a failure:
        # verify.sh:119 prints VERIFY_UNCOVERED and falls through to `verify: PASS`, and its
        # only non-zero exits are an empty COVERED set (:123) and a real failure (:129).
        # Combined with verify.sh:73-77, which downgrades staticcheck to "uncovered" when the
        # binary is missing from PATH, a bare invocation lets CI report success having gated
        # on strictly less than a local run — a broken install step or a unit that loses its
        # typechecker config would both pass silently.
        #
        # So CI holds itself to a stricter bar than the script: any VERIFY_UNCOVERED line is
        # a failure here. The script is cross-project infrastructure and is not edited; this
        # is the caller adding its own requirement on top of the script's exit code.
        run: |
          set +e
          bash .specify/verify.sh 2>&1 | tee /tmp/verify.out
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::the verification gate failed"
            exit "$status"
          fi
          if grep -q '^VERIFY_UNCOVERED:' /tmp/verify.out; then
            echo "::error::gate passed but did not cover every check — CI must not gate on less than a local run"
            grep '^VERIFY_UNCOVERED:' /tmp/verify.out
            exit 1
          fi
