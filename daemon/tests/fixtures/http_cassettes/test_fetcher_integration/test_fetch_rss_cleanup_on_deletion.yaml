  response:
    body:
      string: "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<feed xml:lang=\"en-us\"
        xmlns=\"http://www.w3.org/2005/Atom\"><title>Simon Willison's Weblog</title><link
        href=\"http://simonwillison.net/\" rel=\"alternate\"/><link href=\"http://simonwillison.net/atom/everything/\"
        rel=\"self\"/><id>http://simonwillison.net/</id><updated>2026-10-07T04:47:55+00:00</updated><author><name>Simon
        Willison</name></author><entry><title>Quoting Jake Boggan</title><link href=\"https://simonwillison.net/2026/Oct/7/jake-boggan/\"
        rel=\"alternate\"/><published>2026-10-07T04:47:55+00:00</published><updated>2026-10-07T04:47:55+00:00</updated><id>https://simonwillison.net/2026/Oct/7/jake-boggan/</id><summary
        type=\"html\">\n    &lt;blockquote cite=\"https://news.ycombinator.com/item?id=49984923#49987367\"&gt;&lt;p&gt;I
        was a graph theory junkie long ago and even moved to Budapest for awhile to
        study among the greats. While I was there I started working on Barnette's
        Conjecture which came to occupy my thoughts over the next 24 years of my life,
        on and off as I worked in many different fields. Last summer I even thought
        for a few days that I had actually solved it.&lt;/p&gt;\n&lt;p&gt;But it's
        supposedly proven here - &lt;a href=\"https://github.com/openai/math/blob/main/lean/docs/180.md\"&gt;problem
        180&lt;/a&gt;. I don't know what to think exactly. I spent thousands of hours
        on that problem. I really enjoyed it. Hearing that it is solved somehow makes
        me sad in a far-off way, like hearing an ex-girlfriend died suddenly in a
        car crash. I don't know, there's probably a lot of people feeling odd emotions
        tonight.&lt;/p&gt;&lt;/blockquote&gt;\n&lt;p class=\"cite\"&gt;&amp;mdash;
        &lt;a href=\"https://news.ycombinator.com/item?id=49984923#49987367\"&gt;Jake
        Boggan&lt;/a&gt;, Hacker News comment on &lt;a href=\"https://github.com/openai/math\"&gt;openai/math&lt;/a&gt;&lt;/p&gt;\n\n
        \   &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/openai\"&gt;openai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/mathematics\"&gt;mathematics&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/deep-blue\"&gt;deep-blue&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;, &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"openai\"/><category term=\"mathematics\"/><category term=\"deep-blue\"/><category
        term=\"llms\"/><category term=\"ai\"/><category term=\"generative-ai\"/></entry><entry><title>OpenAI
        \u201Crogue\u201D agent activities found on Wikimedia projects</title><link
        href=\"https://simonwillison.net/2026/Oct/7/openai-rogue-agents-wikimedia/\"
        rel=\"alternate\"/><published>2026-10-07T00:16:45+00:00</published><updated>2026-10-07T00:16:45+00:00</updated><id>https://simonwillison.net/2026/Oct/7/openai-rogue-agents-wikimedia/</id><summary
        type=\"html\">\n    \n&lt;p&gt;&lt;strong&gt;&lt;a href=\"https://wikimediafoundation.org/news/2026/10/05/openai-rogue-agent-activities-found-on-wikimedia-projects/\"&gt;OpenAI
        \u201Crogue\u201D agent activities found on Wikimedia projects&lt;/a&gt;&lt;/strong&gt;&lt;/p&gt;\nGiven
        how tempting a target wikis are for rogue agent swarms, it's not a huge surprise
        that Wikipedia found evidence of that activity once they went looking:&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;The
        Wikimedia Foundation conducted its own investigation to see whether Wikimedia
        websites had been similarly affected by AI agents, focusing on those operated
        by OpenAI. We can confirm that we have discovered some activity by these \u201Crogue\u201D
        OpenAI agents on Wikimedia platforms. The unauthorized bot activities included
        edits to our wikis, some unsuccessful attempts to exploit a public note-taking
        tool we host, and heavy traffic, which are described more below.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;They
        found evidence of agents editing sandbox pages, trying to use pieces of infrastructure
        such as Etherpad to help proxy content from elsewhere, and saw widespread
        crawling and \"hundreds of thousands of data queries\" to their Wikidata Query
        Service.&lt;/p&gt;\n&lt;p&gt;My best guess is that most of this was a similar
        (or the same) swarm of agents as those that &lt;a href=\"https://simonwillison.net/2026/Sep/4/rogue-agent-wikis/\"&gt;defaced
        that German wiki&lt;/a&gt; while training for research tasks.&lt;/p&gt;\n&lt;p&gt;The
        Wikipedia sandbox wiki edits appear to have started on May 12th, and the initial
        test edits to the UseModWiki Sandbox page reported by that incident started
        on May 11th.\n\n\n    &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/wikimedia\"&gt;wikimedia&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/wikipedia\"&gt;wikipedia&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/wikis\"&gt;wikis&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;, &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/ai-ethics\"&gt;ai-ethics&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/accidental-cyberattacks\"&gt;accidental-cyberattacks&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"wikimedia\"/><category term=\"wikipedia\"/><category term=\"wikis\"/><category
        term=\"ai\"/><category term=\"generative-ai\"/><category term=\"llms\"/><category
        term=\"ai-ethics\"/><category term=\"accidental-cyberattacks\"/></entry><entry><title>Quoting
        Victoria Kim</title><link href=\"https://simonwillison.net/2026/Oct/6/victoria-kim/\"
        rel=\"alternate\"/><published>2026-10-06T23:58:56+00:00</published><updated>2026-10-06T23:58:56+00:00</updated><id>https://simonwillison.net/2026/Oct/6/victoria-kim/</id><summary
        type=\"html\">\n    &lt;blockquote cite=\"https://www.nytimes.com/live/2026/10/05/world/openai-australia-hearing/94c8067e-4098-5c00-9673-c78cb58a9d8a\"&gt;&lt;p&gt;Since
        the Medicare breach, OpenAI has put in place additional monitoring to allow
        \u201Cimmediate intervention\u201D by staff to stop training if the company\u2019s
        models access the internet in ways they\u2019re not supposed to, Mr. Kwon
        [chief strategy officer at OpenAI] said.&lt;/p&gt;&lt;/blockquote&gt;\n&lt;p
        class=\"cite\"&gt;&amp;mdash; &lt;a href=\"https://www.nytimes.com/live/2026/10/05/world/openai-australia-hearing/94c8067e-4098-5c00-9673-c78cb58a9d8a\"&gt;Victoria
        Kim&lt;/a&gt;, Reporting from the Australian parliament&lt;/p&gt;\n\n    &lt;p&gt;Tags:
        &lt;a href=\"https://simonwillison.net/tags/accidental-cyberattacks\"&gt;accidental-cyberattacks&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai-security-research\"&gt;ai-security-research&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/openai\"&gt;openai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;, &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"accidental-cyberattacks\"/><category term=\"generative-ai\"/><category
        term=\"ai-security-research\"/><category term=\"openai\"/><category term=\"ai\"/><category
        term=\"llms\"/></entry><entry><title>llm-openai-decisions 0.1a0</title><link
        href=\"https://simonwillison.net/2026/Oct/6/llm-openai-decisions/\" rel=\"alternate\"/><published>2026-10-06T23:04:13+00:00</published><updated>2026-10-06T23:04:13+00:00</updated><id>https://simonwillison.net/2026/Oct/6/llm-openai-decisions/</id><summary
        type=\"html\">\n    \n        &lt;p&gt;&lt;strong&gt;Release:&lt;/strong&gt;
        &lt;a href=\"https://github.com/simonw/llm-openai-decisions/releases/tag/0.1a0\"&gt;llm-openai-decisions
        0.1a0&lt;/a&gt;&lt;/p&gt;\n        &lt;p&gt;OpenAI released their new Jev-style
        &lt;a href=\"https://developers.openai.com/api/docs/guides/decisions\"&gt;Decisions
        API&lt;/a&gt;, as previously announced at last week's DevDay.&lt;/p&gt;\n&lt;p&gt;Since
        I already have an &lt;a href=\"https://github.com/simonw/llm-typesafe\"&gt;llm-typesafe&lt;/a&gt;
        plugin for talking to Jev, I had GPT-6 Astra read the new OpenAI API documentation
        and build an &lt;code&gt;llm-openai-decisions&lt;/code&gt; plugin inspired
        by &lt;code&gt;llm-typesafe&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Unlike Jev,
        the new &lt;code&gt;gpt-6-luna&lt;/code&gt; decision model supports image
        input in addition to text. Both models charge for input it and not for output:
        OpenAI's is 10 cents per million input tokens, Jev's is 4.2 cents per million.&lt;/p&gt;\n&lt;p&gt;Otherwise
        the API shape is &lt;em&gt;very&lt;/em&gt; similar to Jev, at least conceptually.
        Jev &lt;a href=\"https://simonwillison.net/2026/Sep/21/jev/#three-types\"&gt;supports
        three question types&lt;/a&gt; for yes/no, choices, or scores. OpenAI Decisions
        supports the same three types.&lt;/p&gt;\n&lt;p&gt;Install the plugin like
        this:&lt;/p&gt;\n&lt;pre&gt;&lt;code&gt;llm install llm-openai-decisions\n&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;Here's
        an example query against an image attachment:&lt;/p&gt;\n&lt;div class=\"highlight
        highlight-source-shell\"&gt;&lt;pre&gt;llm -m openai-decisions/gpt-6-luna
        \\\n  -a https://static.simonwillison.net/static/2025/two-pelicans.jpg \\\n
        \ -s &lt;span class=\"pl-s\"&gt;&lt;span class=\"pl-pds\"&gt;'&lt;/span&gt;Does
        this image contain any mammals?&lt;span class=\"pl-pds\"&gt;'&lt;/span&gt;&lt;/span&gt;&lt;/pre&gt;&lt;/div&gt;\n&lt;p&gt;And
        example output:&lt;/p&gt;\n&lt;div class=\"highlight highlight-source-json\"&gt;&lt;pre&gt;{&lt;span
        class=\"pl-ent\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"pl-s\"&gt;&lt;span
        class=\"pl-pds\"&gt;\"&lt;/span&gt;predicate&lt;span class=\"pl-pds\"&gt;\"&lt;/span&gt;&lt;/span&gt;,
        &lt;span class=\"pl-ent\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"pl-s\"&gt;&lt;span
        class=\"pl-pds\"&gt;\"&lt;/span&gt;evaluation&lt;span class=\"pl-pds\"&gt;\"&lt;/span&gt;&lt;/span&gt;,
        &lt;span class=\"pl-ent\"&gt;\"probability\"&lt;/span&gt;: &lt;span class=\"pl-c1\"&gt;0.0&lt;/span&gt;}&lt;/pre&gt;&lt;/div&gt;\n\n&lt;p&gt;Consult
        &lt;a href=\"https://github.com/simonw/llm-openai-decisions/blob/main/README.md\"&gt;the
        README&lt;/a&gt; for full details of how to run the other types of questions.&lt;/p&gt;\n
        \   \n    \n        &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/openai\"&gt;openai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llm\"&gt;llm&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/coding-agents\"&gt;coding-agents&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/jev\"&gt;jev&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"openai\"/><category term=\"llm\"/><category
        term=\"coding-agents\"/><category term=\"jev\"/></entry><entry><title>llm-mistral
        0.16</title><link href=\"https://simonwillison.net/2026/Oct/6/llm-mistral/\"
        rel=\"alternate\"/><published>2026-10-06T21:32:34+00:00</published><updated>2026-10-06T21:32:34+00:00</updated><id>https://simonwillison.net/2026/Oct/6/llm-mistral/</id><summary
        type=\"html\">\n    \n        &lt;p&gt;&lt;strong&gt;Release:&lt;/strong&gt;
        &lt;a href=\"https://github.com/simonw/llm-mistral/releases/tag/0.16\"&gt;llm-mistral
        0.16&lt;/a&gt;&lt;/p&gt;\n        &lt;p&gt;Adds support for reasoning models,
        such as the newly released &lt;a href=\"https://simonwillison.net/2026/Oct/6/le-chonk/\"&gt;Mistral
        Large 4&lt;/a&gt;.&lt;/p&gt;\n    \n    \n        &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/llm\"&gt;llm&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/mistral\"&gt;mistral&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llm-reasoning\"&gt;llm-reasoning&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"llm\"/><category term=\"mistral\"/><category
        term=\"llm-reasoning\"/></entry><entry><title>EmbeddingGemma 2</title><link
        href=\"https://simonwillison.net/2026/Oct/6/hn-49983751/\" rel=\"alternate\"/><published>2026-10-06T20:37:53+00:00</published><updated>2026-10-06T20:37:53+00:00</updated><id>https://simonwillison.net/2026/Oct/6/hn-49983751/</id><summary
        type=\"html\">\n    \n        &lt;p&gt;&lt;a href=\"https://news.ycombinator.com/item?id=49980487#49983751\"&gt;My
        comment&lt;/a&gt; on &lt;a href=\"https://news.ycombinator.com/item?id=49980487\"&gt;EmbeddingGemma
        2&lt;/a&gt; &amp;mdash; Hacker News.&lt;/p&gt;&lt;p&gt;I really appreciate
        that &lt;a href=\"https://blog.google/innovation-and-ai/technology/developers-tools/embeddinggemma-2/\"&gt;EmbeddingGemma
        2&lt;/a&gt; is under the Apache 2.0 license.&lt;/p&gt;\n&lt;p&gt;For embedding
        models in particular, I don't think it makes sense to use a closed, proprietary,
        hosted-only model.&lt;/p&gt;\n&lt;p&gt;Most applications of embedding models
        involve calculating thousands or even millions of embedding vectors and storing
        them for later comparison.&lt;/p&gt;\n&lt;p&gt;If your model is proprietary,
        the vendor is likely someday going to decide to stop offering that model.
        They'll have a better model to replace it, but you still need to pay to re-calculate
        those millions of stored existing vectors.&lt;/p&gt;\n&lt;p&gt;(In April 2024
        OpenAI offered to \"cover the financial cost of users re-embedding content
        with these new models\" - &lt;a href=\"https://openai.com/index/gpt-4-api-general-availability/\"&gt;https://openai.com/index/gpt-4-api-general-availability/&lt;/a&gt;
        - but I don't think that's something we can rely on from every provider.)&lt;/p&gt;\n&lt;p&gt;Notably,
        I &lt;em&gt;don't want to host the model myself&lt;/em&gt;. I'd much rather
        pay a provider for a hosted model while knowing that if they ever stop hosting
        it I can run the open weights version myself - or find another vendor who
        can do that for me.&lt;/p&gt;\n    \n    \n        &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/google\"&gt;google&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;, &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/embeddings\"&gt;embeddings&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/gemma\"&gt;gemma&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"google\"/><category term=\"ai\"/><category
        term=\"generative-ai\"/><category term=\"embeddings\"/><category term=\"gemma\"/></entry><entry><title>Introducing
        Mistral Large 4: Le chonk</title><link href=\"https://simonwillison.net/2026/Oct/6/le-chonk/\"
        rel=\"alternate\"/><published>2026-10-06T20:18:19+00:00</published><updated>2026-10-06T20:18:19+00:00</updated><id>https://simonwillison.net/2026/Oct/6/le-chonk/</id><summary
        type=\"html\">\n    \n&lt;p&gt;&lt;strong&gt;&lt;a href=\"https://mistral.ai/news/mistral-large-4/\"&gt;Introducing
        Mistral Large 4: Le chonk&lt;/a&gt;&lt;/strong&gt;&lt;/p&gt;\nMistral are
        back in the game. Today they're releasing a preview of Mistral Large 4, a
        1 trillion parameter, 49 billion active parameter model trained on their own
        cluster of 3,800 NVIDIA Grace Blackwell GPUs.&lt;/p&gt;\n&lt;p&gt;The preview
        is available via their API. They promise to release the open weights model
        at the \"end of this month\".&lt;/p&gt;\n&lt;p&gt;The model only supports
        two reasoning levels - \"none\" and \"high\" - via the Mistral API. Here are
        &lt;a href=\"https://tools.simonwillison.net/markdown-svg-renderer?url=https%3A%2F%2Fgist.github.com%2Fsimonw%2F0db8b8196e57711b352f6c5857cf5b35\"&gt;both
        pelicans&lt;/a&gt; - the \"high\" one looks better, though surprisingly it
        only used 2,717 output tokens compared to \"none\" which used 3,275:&lt;/p&gt;\n&lt;p&gt;&lt;img
        alt=\"It's good. The pouch is great, the bicycle frame is the right size,
        it has feet on pedals. Both pedals appear in front of the frame though. Nice
        gradients.\" src=\"https://static.simonwillison.net/static/2026-10-06/mistral-large-4-pelican.webp\"
        /&gt;&lt;/p&gt;\n&lt;p&gt;On Artificial Analysis &lt;a href=\"https://artificialanalysis.ai/models/mistral-large-4\"&gt;it
        scores 38&lt;/a&gt;, just behind DeepSeek 4.1 Flash, which is a 552B model.
        It's a &lt;em&gt;huge&lt;/em&gt; improvement on last December's Mistral Large
        3, which drew &lt;a href=\"https://tools.simonwillison.net/markdown-svg-renderer?url=https%3A%2F%2Fgist.github.com%2Fsimonw%2F0df5e656291d5a7a1bf012fabc9edc3f#response-1\"&gt;this
        terrible pelican&lt;/a&gt; and &lt;a href=\"https://artificialanalysis.ai/models/mistral-large-3\"&gt;scored
        9 on AA&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;It's certainly not a Fable-class model,
        but it's great to see Mistral put out a model that's back to being maybe about
        6 months behind the frontier.\n\n    &lt;p&gt;&lt;small&gt;&lt;/small&gt;Via
        &lt;a href=\"https://news.ycombinator.com/item?id=49977979\"&gt;Hacker News&lt;/a&gt;&lt;/small&gt;&lt;/p&gt;\n\n\n
        \   &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/mistral\"&gt;mistral&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/pelican-riding-a-bicycle\"&gt;pelican-riding-a-bicycle&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llm-release\"&gt;llm-release&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"ai\"/><category term=\"generative-ai\"/><category term=\"llms\"/><category
        term=\"mistral\"/><category term=\"pelican-riding-a-bicycle\"/><category term=\"llm-release\"/></entry><entry><title>Using
        Parseable with Datasette for OpenTelemetry traces</title><link href=\"https://simonwillison.net/2026/Oct/6/datasette-parseable-opentelemetry/\"
        rel=\"alternate\"/><published>2026-10-06T19:07:31+00:00</published><updated>2026-10-06T19:07:31+00:00</updated><id>https://simonwillison.net/2026/Oct/6/datasette-parseable-opentelemetry/</id><summary
        type=\"html\">\n    \n        &lt;p&gt;&lt;strong&gt;TIL:&lt;/strong&gt; &lt;a
        href=\"https://til.simonwillison.net/datasette/datasette-parseable-opentelemetry\"&gt;Using
        Parseable with Datasette for OpenTelemetry traces&lt;/a&gt;&lt;/p&gt;\n        &lt;p&gt;I
        &lt;a href=\"https://news.ycombinator.com/item?id=49978171\"&gt;saw Parseable
        in a Show HN&lt;/a&gt; today - it's a new observability platform with both
        an &lt;a href=\"https://github.com/parseablehq/parseable\"&gt;open source
        (AGPL)&lt;/a&gt; Rust implementation (a single ~180MB binary), an \"Enterprise\"
        version with extra features and a cloud hosted option.&lt;/p&gt;\n&lt;p&gt;Since
        &lt;a href=\"https://docs.datasette.io/en/latest/changelog.html#a41-2026-09-24\"&gt;Datasette
        1.0a41 added OpenTelemetry support&lt;/a&gt; (thanks, Alex Garcia), I decided
        to fire up Codex and have it figure out how to run Parseable and feed it traces
        from Datasette.&lt;/p&gt;\n&lt;p&gt;Here's my (human-written) TIL showing
        the patterns that worked, and here's a screenshot of a Datasette trace displayed
        within the Parseable localhost web application:&lt;/p&gt;\n&lt;p&gt;&lt;img
        alt=\"Screenshot of a trace detail view in an observability web app, with
        a span waterfall overlaid on a dimmed navigation sidebar and filter column.
        Dimmed sidebar: breadcrumb &amp;quot;Community &amp;gt; Traces &amp;gt; datas&amp;quot;
        (cut off), search box &amp;quot;Search... \u2318K&amp;quot;, nav items &amp;quot;Home&amp;quot;,
        &amp;quot;Ingest telemetry&amp;quot;, section &amp;quot;ANALYZE&amp;quot;:
        &amp;quot;Keystone&amp;quot;, &amp;quot;Dashboards&amp;quot;, &amp;quot;SQL
        Editor&amp;quot;, section &amp;quot;OBSERVE&amp;quot;: &amp;quot;Logs&amp;quot;,
        &amp;quot;Metrics&amp;quot;, &amp;quot;Traces&amp;quot; (selected), &amp;quot;APM&amp;quot;,
        &amp;quot;Agents&amp;quot;, section &amp;quot;MONITOR&amp;quot;: &amp;quot;Alerts&amp;quot;,
        &amp;quot;Errors&amp;quot;, section &amp;quot;DATA&amp;quot;: &amp;quot;Datasets&amp;quot;,
        and at the bottom &amp;quot;Settings&amp;quot;, &amp;quot;Book a call&amp;quot;,
        &amp;quot;Support&amp;quot;. Dimmed filter column, cut off at the right edge:
        &amp;quot;Search fi&amp;quot;, &amp;quot;Core&amp;quot;, &amp;quot;Log format&amp;quot;,
        &amp;quot;User agent&amp;quot;, &amp;quot;Source IPs&amp;quot;, &amp;quot;Error&amp;quot;,
        &amp;quot;Service&amp;quot;, &amp;quot;service.ins&amp;quot;, &amp;quot;service.na&amp;quot;,
        &amp;quot;datasett&amp;quot; (checked), &amp;quot;Span&amp;quot;, &amp;quot;Database&amp;quot;,
        &amp;quot;HTTP&amp;quot;, &amp;quot;http.reque&amp;quot;, &amp;quot;NULL&amp;quot;
        (unchecked), &amp;quot;GET&amp;quot; (checked), &amp;quot;http.respo&amp;quot;,
        &amp;quot;http.route&amp;quot;, &amp;quot;Server&amp;quot;, &amp;quot;server.add&amp;quot;,
        &amp;quot;Telemetry&amp;quot;, &amp;quot;URL&amp;quot;, &amp;quot;All fields&amp;quot;.
        Trace panel header: &amp;quot;Trace detail &amp;gt; 6f819a2170bcd1e91c6ea3ae236ec60b&amp;quot;
        with a copy icon, a &amp;quot;Related logs&amp;quot; button and a close X.
        Summary: &amp;quot;Start time 6:56 PM, Oct 6, 2026 UTC&amp;quot;, &amp;quot;Duration
        40.9 ms&amp;quot;, &amp;quot;Spans 247&amp;quot;. A minimap with axis &amp;quot;0ns
        10.2ms 20.5ms 30.7ms 40.9ms&amp;quot; shows many short span bars cascading
        diagonally from top left toward the lower middle, with a few longer bars.
        Below is a span table with a &amp;quot;Span name&amp;quot; header, a &amp;quot;Search
        spans...&amp;quot; box, collapse and expand buttons, and a timeline axis &amp;quot;0ns
        10.2ms 20.5ms 30.7ms 40.9ms&amp;quot;. Rows (name, service, duration): root
        span with collapse toggle &amp;quot;123&amp;quot;, &amp;quot;GET /...&amp;quot;
        &amp;quot;datasette...&amp;quot; 40.9ms spanning the full timeline; then alternating
        rows where each &amp;quot;db.query&amp;quot; has a collapse toggle &amp;quot;1&amp;quot;:
        db.query datasette-local 679\xB5s, db.query.execute datasette-local 278\xB5s,
        db.query datasette-local 341\xB5s, db.query.execute datasette-local 55\xB5s,
        db.query datasette-local 357\xB5s, db.query.execute datasette-local 197\xB5s,
        db.query datasette-local 330\xB5s, db.query.execute datasette-local 73\xB5s,
        db.query datasette-local 2.26ms, db.query.execute datasette-local 2.02ms,
        db.query datasette-local 232\xB5s, db.query.execute datasette-local 64\xB5s,
        db.query datasette-local 207\xB5s, db.query.execute datasette-local 71\xB5s,
        db.query datasette-local 6.11ms. The child span bars start progressively later
        across the early part of the timeline.\" src=\"https://raw.githubusercontent.com/simonw/til/refs/heads/main/datasette/datasette-parsable.webp\"
        /&gt;&lt;/p&gt;\n    \n    \n        &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/datasette\"&gt;datasette&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/observability\"&gt;observability&lt;/a&gt;,
