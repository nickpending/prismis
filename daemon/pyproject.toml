[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismis-daemon"
version = "0.2.0"
description = "Prismis daemon for content fetching and analysis"
requires-python = ">=3.13"
dependencies = [
    "apscheduler",
    "cryptography",
    "fastapi>=0.116.1",
    "feedparser",
    "httpx",
    "llm-core>=0.1.0",
    "praw>=7.8.1",
    "pydantic",
    "python-dotenv",
    "rich",
    "sentence-transformers>=2.0.0",
    # Direct only so [tool.uv.sources] can route it: uv applies sources to direct
    # dependencies, and sentence-transformers would otherwise pull the CUDA build.
    "torch",
    "sqlite-vec>=0.1.0",
    "trafilatura",
    "typer",
    "uvicorn>=0.35.0",
    # fetchers/youtube.py:39-42 hard-requires the yt-dlp binary on PATH and raises
    # without it, so it is a runtime dependency, not an optional extra.
    "yt-dlp",
    "openai>=3.19.2",
    "apiconf",
]

# CPU-only torch on Linux, where PyPI's default wheel carries ~4GB of CUDA libraries.
# The only model prismis runs is a small embedder; a GPU would not speed it up in any
# way that matters (#74). macOS wheels have no CUDA, so they stay on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
prismis-daemon = "prismis_daemon.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prismis_daemon"]

[dependency-groups]
dev = [
    "mypy",
    "types-requests",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
# scripts/ holds operator tools (e.g. model_playtest.py) that are not part of the shipped package.
exclude = ["scripts"]

[tool.ruff.lint]
# Decidable defect classes, not style. E4/E7/E9/F are ruff's defaults; the rest add
# weakened types (ANN401, PGH, RUF013), unhandled async/error paths (ASYNC, BLE, S110,
# S112, RUF006), dead code (ERA), and mutable-default/inherited bugs (B, RUF012).
select = [
    "E4", "E7", "E9", "F",
    "B", "ASYNC", "BLE", "ERA",
    "RUF006", "RUF012", "RUF013", "RUF100",
    "ANN401", "PGH", "S110", "S112",
]

[tool.ruff.lint.per-file-ignores]
"src/prismis_daemon/api.py" = ["B008"]  # FastAPI Depends() in argument defaults
# BLE001 (blind `except Exception`) is SUPPRESSED across every Python file in this unit.
# The glob below covers everything, so no ruff run reports the class and `ruff check .`
# passing says nothing about it. The 62 findings here are recoverable only by deleting
# this entry (`ruff check . --select BLE001 --config 'lint.per-file-ignores = {}'`).
# Narrowing these excepts changes runtime behavior in an unattended pipeline, so the work
# is deferred rather than done — but deferred is not the same as visible, and this is a
# suppression, not a policy. Tracked: https://github.com/nickpending/prismis/issues/58
"**/*.py" = ["BLE001"]

[tool.mypy]
# `uv run mypy .` from this directory is the gate's typecheck (ember's house toolchain).
python_version = "3.13"
mypy_path = ["src", "tests"]
explicit_package_bases = true
exclude = ["^scripts/", "^\\.venv/"]

# These ship no type information and have no stubs package; their calls are unchecked.
[[tool.mypy.overrides]]
module = ["apscheduler.*", "feedparser", "llm_core", "llm_core.*", "praw", "praw.*", "prawcore", "prawcore.*", "sqlite_vec"]
ignore_missing_imports = true

[tool.uv.sources]
llm-core = { git = "https://github.com/nickpending/llm-core", subdirectory = "python", rev = "2eb4429" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
apiconf = { git = "https://github.com/nickpending/apiconf", subdirectory = "python", rev = "6fd244a" }
