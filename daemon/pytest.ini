[pytest]
# `[tool:pytest]` is the setup.cfg section name and is inert in a pytest.ini, so every
# option below was silently ignored until this header was corrected.
# `pythonpath` is core pytest's option; the old `python_paths` belonged to a plugin that
# is not installed. `tests` is on the path so test modules can import the shared
# TEST_API_KEY constant from conftest explicitly rather than relying on pytest's
# implicit rootdir insertion.
pythonpath = src tests
testpaths = tests
python_classes = Test*
python_functions = test_*
python_files = test_*.py
# Verbosity belongs to the caller: verify.sh and the SC-8/SC-9 checks all pass -q.
addopts = --tb=short
