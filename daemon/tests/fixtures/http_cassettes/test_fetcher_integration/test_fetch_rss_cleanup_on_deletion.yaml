        If you are a sponsor (or start a sponsorship now) you can &lt;a href=\"https://github.com/simonw-private/monthly/blob/main/2026-09-september.md\"&gt;access
        it here&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;This month:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;More
        Fable class models&lt;/li&gt;\n&lt;li&gt;A pricing war&lt;/li&gt;\n&lt;li&gt;3D
        graphics, Blender, and pixel art&lt;/li&gt;\n&lt;li&gt;LLMs come for mathematics&lt;/li&gt;\n&lt;li&gt;So
        many more accidental cyberattacks&lt;/li&gt;\n&lt;li&gt;The vulnapocalypse
        comes for Datasette&lt;/li&gt;\n&lt;li&gt;What I'm using right now&lt;/li&gt;\n&lt;li&gt;My
        software releases this month&lt;/li&gt;\n&lt;li&gt;2026 in LLMs (so far)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Here's
        &lt;a href=\"https://github.com/simonw/monthly-newsletter-archive/blob/main/2026-08-august.md\"&gt;a
        copy of the August newsletter&lt;/a&gt; as a preview of what you'll get. Pay
        $10/month to stay a month ahead of the free copy!&lt;/p&gt;\n\n    &lt;p&gt;Tags:
        &lt;a href=\"https://simonwillison.net/tags/newsletter\"&gt;newsletter&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"newsletter\"/></entry><entry><title>Rex's Dino Store</title><link href=\"https://simonwillison.net/2026/Oct/2/rex-s-dino-store/\"
        rel=\"alternate\"/><published>2026-10-02T22:57:38+00:00</published><updated>2026-10-02T22:57:38+00:00</updated><id>https://simonwillison.net/2026/Oct/2/rex-s-dino-store/</id><summary
        type=\"html\">\n    \n        &lt;p&gt;&lt;strong&gt;Museum:&lt;/strong&gt;
        &lt;a href=\"https://www.niche-museums.com/119\"&gt;Rex&amp;#x27;s Dino Store&lt;/a&gt;&lt;/p&gt;\n
        \       &lt;p&gt;Located just before the turnstiles in the Grand Army Plaza
        subway station at the north end of Brooklyn's Prospect Park is this former
        newsstand which is now operated by a dinosaur.&lt;/p&gt;\n&lt;p&gt;The density
        of dinosaur puns is &lt;em&gt;exceptional&lt;/em&gt;.&lt;/p&gt;\n    \n    \n
        \       &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/art\"&gt;art&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/new-york\"&gt;new-york&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"art\"/><category term=\"new-york\"/></entry><entry><title>pwasm
        0.2a0</title><link href=\"https://simonwillison.net/2026/Oct/1/pwasm/\" rel=\"alternate\"/><published>2026-10-01T17:10:31+00:00</published><updated>2026-10-01T17:10:31+00:00</updated><id>https://simonwillison.net/2026/Oct/1/pwasm/</id><summary
        type=\"html\">\n    \n        &lt;p&gt;&lt;strong&gt;Release:&lt;/strong&gt;
        &lt;a href=\"https://github.com/simonw/pwasm/releases/tag/0.2a0\"&gt;pwasm
        0.2a0&lt;/a&gt;&lt;/p&gt;\n        &lt;p&gt;pwasm is one of my folly projects
        - an entirely vibe-coded pure Python WebAssembly engine that I built in January
        during my first bout of &lt;a href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.012.webp\"&gt;AI
        mania&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;I hadn't touched it since January, so
        I decided to let Claude Opus 5.5 loose on it and see if it could make any
        significant improvements:&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;Evaluate
        current state of pwasm - then consider what it would take to get the MicroPython
        and micro JavaScript experiments from the &lt;a href=\"https://github.com/simonw/research\"&gt;research
        repo&lt;/a&gt; working under it - and what it would take to speed it up&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;&lt;a
        href=\"https://github.com/simonw/pwasm/pull/12\"&gt;42 commits later&lt;/a&gt;
        (with minimal follow-up prompting) it now handles almost all of the WASM specification,
        and the wheel from PyPI bundles working WASM builds of  &lt;a href=\"https://micropython.org/\"&gt;MicroPython&lt;/a&gt;,
        &lt;a href=\"https://github.com/quickjs-ng/quickjs\"&gt;QuickJS&lt;/a&gt;
        and &lt;a href=\"https://github.com/bellard/mquickjs\"&gt;Micro QuickJS&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;I
        wouldn't trust this thing at all - hence the alpha version tag - but it's
        interesting seeing how today's models can improve on the work of models from
        10 months ago.&lt;/p&gt;\n    \n    \n        &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/python\"&gt;python&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/webassembly\"&gt;webassembly&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/vibe-coding\"&gt;vibe-coding&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"python\"/><category term=\"webassembly\"/><category
        term=\"vibe-coding\"/></entry><entry><title>Quoting Matthew Green</title><link
        href=\"https://simonwillison.net/2026/Oct/1/matthew-green/\" rel=\"alternate\"/><published>2026-10-01T06:29:01+00:00</published><updated>2026-10-01T06:29:01+00:00</updated><id>https://simonwillison.net/2026/Oct/1/matthew-green/</id><summary
        type=\"html\">\n    &lt;blockquote cite=\"https://blog.cryptographyengineering.com/2026/09/30/is-sandboxing-sufficient-to-contain-rogue-agents/\"&gt;&lt;p&gt;[...]
        Put these pieces together and you have the two halves of a worm: a payload
        that hijacks the agent, and an agent that will carry the payload to the next
        agent. Agents in separately-isolated sandboxes discovered that they could
        leave instructions for each other in a shared package cache, and those instructions
        changed what the recipients did. Replace the package cache with email, Slack
        and shared documents or WhatsApp, and replace independently-sandboxed training
        runs with independently-deployed personal agents like Muse, and you have exactly
        the ingredients that a worm needs.&lt;/p&gt;&lt;/blockquote&gt;\n&lt;p class=\"cite\"&gt;&amp;mdash;
        &lt;a href=\"https://blog.cryptographyengineering.com/2026/09/30/is-sandboxing-sufficient-to-contain-rogue-agents/\"&gt;Matthew
        Green&lt;/a&gt;, Is sandboxing sufficient to contain rogue agents?&lt;/p&gt;\n\n
        \   &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/accidental-cyberattacks\"&gt;accidental-cyberattacks&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai-misuse\"&gt;ai-misuse&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai-security-research\"&gt;ai-security-research&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/sandboxing\"&gt;sandboxing&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;, &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"accidental-cyberattacks\"/><category term=\"ai-misuse\"/><category
        term=\"generative-ai\"/><category term=\"ai-security-research\"/><category
        term=\"sandboxing\"/><category term=\"ai\"/><category term=\"llms\"/></entry><entry><title>He
        Built This City</title><link href=\"https://simonwillison.net/2026/Sep/30/he-built-this-city/\"
        rel=\"alternate\"/><published>2026-09-30T21:54:19+00:00</published><updated>2026-09-30T21:54:19+00:00</updated><id>https://simonwillison.net/2026/Sep/30/he-built-this-city/</id><summary
        type=\"html\">\n    &lt;p&gt;I visited the Museum of the City of New York
        today and got to see &lt;a href=\"https://www.mcny.org/exhibition/he-built-city\"&gt;He
        Built This City: Joe Macken\u2019s Model&lt;/a&gt;, the 50 x27 feet model
        of the city built over a 21 year period from balsa wood and cardboard.&lt;/p&gt;\n&lt;p&gt;It
        exceeded my already high expectations. The exhibition closes on 12th October
        so you should absolutely make a priority to see it if you get the chance.&lt;/p&gt;\n&lt;p&gt;&lt;video\n
        \ src=\"https://static.simonwillison.net/static/2026-10-01/He-built-this-city-medium.mp4\"\n
        \ poster=\"https://static.simonwillison.net/static/2026-10-01/IMG_8545.jpeg\"\n
        \ preload=\"none\"\n  loop controls\n  playsinline muted\n  width=\"1280\"\n
        \ height=\"720\"\n  style=\"display: block; width: 100%; height: auto;\"\n&gt;&lt;/video&gt;\n&lt;/p&gt;\n\n
        \   &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/museums\"&gt;museums&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/new-york\"&gt;new-york&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"museums\"/><category term=\"new-york\"/></entry><entry><title>Quoting
        Anthropic Frontier Red Team</title><link href=\"https://simonwillison.net/2026/Sep/29/anthropic-frontier-red-team/\"
        rel=\"alternate\"/><published>2026-09-29T22:20:28+00:00</published><updated>2026-09-29T22:20:28+00:00</updated><id>https://simonwillison.net/2026/Sep/29/anthropic-frontier-red-team/</id><summary
        type=\"html\">\n    &lt;blockquote cite=\"https://www.anthropic.com/research/glm-5-3-and-the-spread-of-advanced-cyber-capabilities\"&gt;&lt;p&gt;We
        evaluate several models on 100 tasks from the [internal Binary Exploitation
        benchmark] (selected at random), and find that GLM-5.3 develops full control
        flow hijacks in 4% of the trials; Claude Mythos Preview did so in 6%. Although
        GLM-5.3 performs below Claude Mythos Preview here, a meaningful threshold
        has clearly been crossed: earlier models, like Claude Opus 4.6 and GLM-5.2,
        do not succeed in any of them.&lt;/p&gt;&lt;/blockquote&gt;\n&lt;p class=\"cite\"&gt;&amp;mdash;
        &lt;a href=\"https://www.anthropic.com/research/glm-5-3-and-the-spread-of-advanced-cyber-capabilities\"&gt;Anthropic
        Frontier Red Team&lt;/a&gt;, GLM-5.3 and the spread of advanced cyber capabilities&lt;/p&gt;\n\n
        \   &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/anthropic\"&gt;anthropic&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai-security-research\"&gt;ai-security-research&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/glm\"&gt;glm&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;, &lt;a href=\"https://simonwillison.net/tags/ai-in-china\"&gt;ai-in-china&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"anthropic\"/><category term=\"generative-ai\"/><category term=\"ai-security-research\"/><category
        term=\"glm\"/><category term=\"ai\"/><category term=\"ai-in-china\"/><category
        term=\"llms\"/></entry><entry><title>GPT 6.1 Sol: Near-Astra intelligence
        for a fifth of the price</title><link href=\"https://simonwillison.net/2026/Sep/29/hn-49898129/\"
