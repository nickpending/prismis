name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs the SAME gate as local: `.specify/verify.sh`. Not a reimplementation of its
# checks — the script itself, so the two can never disagree about what "green" means.
#
# The install step walks the same self-discovery verify.sh does (`find` for
# pyproject.toml and go.mod, with the same exclusions) rather than hand-listing
# [daemon, cli, tui]. A hand-maintained enumeration silently omits a unit: this repo
# already lost twelve daemon test files to a gap like that, and they sat unexecuted long
# enough for the code to drift out from under them. A unit added later is gated here
# automatically, with no list to keep in step.
#
# One job per runner OS, not one per language: verify.sh runs every unit in a single invocation,
# so each runner needs uv, Python and Go all present at once. The macOS runner is there for the
# Swift unit (macos/), which verify.sh runs only on Darwin and reports uncovered elsewhere; it runs
# every other unit too, so each OS gates the whole tree.
# The gate only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: verify on ${{ matrix.os }} (every unit)
    runs-on: ${{ matrix.os }}
    strategy:
      # Each OS is its own verdict: a Linux failure must not cancel the macOS run, or the reverse.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            playwright-cache: ~/.cache/ms-playwright
          - os: macos-latest
            playwright-cache: ~/Library/Caches/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not the default shallow clone: the secret scan below
          # (gh #70) walks every commit with `gitleaks git`, and a depth-1 checkout
          # would let a secret introduced and later removed pass unseen.
          fetch-depth: 0
          # Nothing here pushes, so the token is not left in .git/config for later steps.
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # daemon pulls sentence-transformers (and therefore torch), so a cold resolve
          # is expensive. Key on the lockfiles that determine the resolution.
          cache-dependency-glob: "**/uv.lock"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      # The embedding model is an ambient input the test seal cannot reach.
      # huggingface_hub resolves HF_HOME at IMPORT from XDG_CACHE_HOME
      # (huggingface_hub/constants.py, the HF_HOME assignment), and that import happens
      # during pytest collection via api.py's `from .embeddings import Embedder` ->
      # embeddings.py's `from sentence_transformers import SentenceTransformer` — before
      # any autouse fixture can set a variable. So `Embedder()` (api.py, inside the
      # search and similar-content handlers) always reads whatever cache the machine has.
      #
      # Sealing HF_HOME to a per-run temp dir would force a fresh ~90MB download on every
      # local run. Caching it here makes the input explicit, the way
      # the SHA-pinned actions and the `tool` pins in tui/go.mod do, so the gate's
      # result depends on the code, not on when it ran or whether huggingface.co is up.
      #
      # The key is DERIVED from the file that names the model, not hand-written. A literal
      # would go stale silently: actions/cache skips the save on an exact-key hit, so after
      # the model changed every run would restore the old one and re-download the new one
      # forever. hashFiles ties the key to embeddings.py, so changing the model changes the
      # key and the next run repopulates — the same derivation ci.yml uses for uv's
      # cache-dependency-glob.
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('daemon/src/prismis_daemon/embeddings.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install every unit's dependencies
        # verify.sh assumes dependencies are already present; these two loops mirror its
        # own unit discovery (the pyproject.toml and go.mod `find` walks).
        #
        # staticcheck and gitleaks need no install step: they are `tool` directives in
        # tui/go.mod, so `go tool` builds them at the version pinned there, verified
        # against Go's sumdb. Local runs and CI both use that one version. Dependabot
        # tracks the pin (see .github/dependabot.yml).
        run: |
          set -euo pipefail
          while IFS= read -r pp; do
            dir="$(dirname "$pp")"
            echo "--- uv sync in ${dir#./}"
            (cd "$dir" && uv sync --frozen)
          done < <(find . -name pyproject.toml \
                     -not -path '*/.venv/*' -not -path '*/node_modules/*' \
                     -not -path '*/build/*' -not -path '*/dist/*' | sort)
          while IFS= read -r gm; do
            dir="$(dirname "$gm")"
            echo "--- go mod download in ${dir#./}"
            (cd "$dir" && go mod download)
          done < <(find . -name go.mod -not -path '*/vendor/*' | sort)

      # The web-view browser tests (daemon/tests/integration/test_web_browser_integration.py)
      # drive Chromium, which `uv sync` does not install. The cache key is DERIVED from the
      # Playwright version the daemon environment actually has, not hand-written: a Playwright
      # bump needs a matching browser build and so changes the key, while an unrelated lock
      # change leaves it alone. `install --with-deps` also fetches the system libraries
      # Chromium needs on the runner; it is a no-op for the browser itself on a cache hit.
      - name: Read the installed Playwright version
        id: playwright
        working-directory: daemon
        run: |
          echo "version=$(uv run --frozen python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Where Playwright keeps browsers on this runner's OS.
          path: ${{ matrix.playwright-cache }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for the browser tests
        working-directory: daemon
        run: uv run --frozen playwright install --with-deps chromium

      - name: Verify
        # The gate's own contract treats an uncovered check as a notice, not a failure:
        # verify.sh prints VERIFY_UNCOVERED and falls through to `verify: PASS`, and its
        # only non-zero exits are an empty COVERED set and a real failure. A bare
        # invocation could therefore let CI report success having gated on strictly less
        # than a local run — a unit that loses its typechecker config would pass silently.
        #
        # So CI holds itself to a stricter bar than the script: any VERIFY_UNCOVERED entry is
        # a failure here, with one exception. On Linux the gate reports a Swift unit uncovered
        # (`swift(<dir>): macOS only ...`) because Swift runs only on macOS, and the macOS job
        # in this matrix runs it; that entry alone is tolerated, and only on Linux. This is the
        # caller adding its own requirement on top of the script's exit code.
        run: |
          set +e
          bash .specify/verify.sh 2>&1 | tee /tmp/verify.out
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::the verification gate failed"
            exit "$status"
          fi
          uncovered="$(sed -n 's/^VERIFY_UNCOVERED: //p' /tmp/verify.out | tr ';' '\n' | sed 's/^ *//')"
          if [ "$RUNNER_OS" = Linux ]; then
            uncovered="$(printf '%s\n' "$uncovered" | grep -v '^swift([^)]*): macOS only' || true)"
          fi
          if [ -n "$uncovered" ]; then
            echo "::error::gate passed but did not cover every check — CI must not gate on less than a local run"
            printf '%s\n' "$uncovered"
            exit 1
          fi

      - name: Secret scan (full git history)
        # The Verify step above only scans today's working tree (verify.sh's
        # gitleaks(.) check, gh #70); a secret introduced and later deleted never
        # shows up there. This walks every commit instead, over the full-depth
        # checkout above, with the same .gitleaks.toml allowlist the working-tree
        # scan uses.
        #
        # .betterleaksignore fingerprints the historical findings .gitleaks.toml's
        # value-anchored allowlist cannot reach: values in files that no longer hold
        # them in the working tree, so there is no live line left to attach a
        # `gitleaks:allow` comment to. Any other finding fails this step. The ember
        # gate's betterleaks scan reads the same file from the root.
        #
        # Runs `go tool gitleaks` from tui/ (where the tool directive lives) against the
        # repo root, so the config and ignore paths are given relative to tui/.
        #
        # History is the same on every runner, so one scan, on Linux, is enough.
        if: runner.os == 'Linux'
        working-directory: tui
        run: go tool gitleaks git .. --redact --no-banner --config ../.gitleaks.toml --gitleaks-ignore-path ../.betterleaksignore
