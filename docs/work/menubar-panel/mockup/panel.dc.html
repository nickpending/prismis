<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prismis panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00D9FF}a:hover{color:#7FEBFF}
.row{display:flex;gap:12px;padding:12px 14px;border-radius:10px;text-decoration:none;color:inherit;transition:background .12s ease}
.row:hover,.row:focus-visible{background:#18202B;outline:none}
.row .sum{display:none}
.row:hover .sum,.row:focus-visible .sum{display:block}
.title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:#9AA4B2;cursor:pointer}
.iconbtn:hover{background:#18202B;color:#EEEEEE}
.open{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid #00D9FF;color:#00D9FF;text-decoration:none;font-weight:500;font-size:13px}
.open:hover{background:rgba(0,217,255,0.10);color:#7FEBFF}
</style>
</helmet>
<div style="width: 560px; height: 760px; box-sizing: border-box; background: #07090D; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #EEEEEE; position: relative; overflow: hidden;">
  <div style="height: 28px; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 16px; background: #14171D; border-bottom: 1px solid #1F242C; font-size: 12px; color: #C9CED6;">
    <span>Wi‑Fi</span>
    <span style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 22px; border-radius: 6px; background: #252B35; position: relative;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#EEEEEE" stroke-width="1.4" aria-hidden="true"><path d="M8 2 L14 13 L2 13 Z"></path><path d="M8 6 L8 13"></path></svg>
      <span style="position: absolute; top: 2px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 6px {{accent}};"></span>
    </span>
    <span>Tue 5:12 PM</span>
  </div>

  <div style="position: absolute; top: 36px; right: 12px; width: 380px; box-sizing: border-box; background: #10141B; border: 1px solid rgba(0,217,255,0.18); border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.4); display: flex; flex-direction: column;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 16px 18px 10px 18px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-size: 22px; font-weight: 600; color: {{accent}}; font-family: 'IBM Plex Mono', monospace;">3</span>
        <span style="font-size: 14px; font-weight: 500;">new since you last looked</span>
      </div>
      <span style="font-size: 11px; color: #9AA4B2; font-family: 'IBM Plex Mono', monospace;">scored 4m ago</span>
    </div>
    <div style="height: 1px; background: #1F2630; margin: 0 18px;"></div>

    <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 6px;">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
        <a class="row" href="#">
          <span style="flex: 0 0 8px; padding-top: 7px;">
            <sc-if value="{{item.isNew}}" hint-placeholder-val="{{true}}">
              <span style="display: block; width: 7px; height: 7px; border-radius: 50%; background: {{accent}};"></span>
            </sc-if>
          </span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
            <span class="title" style="font-size: 13.5px; line-height: 1.35; font-weight: {{item.weight}}; color: {{item.titleColor}};">{{item.title}}</span>
            <span style="display: flex; align-items: center; gap: 8px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #9AA4B2;">
              <span>{{item.source}}</span>
              <sc-if value="{{item.kind}}" hint-placeholder-val="{{true}}">
                <span style="padding: 1px 7px; border-radius: 999px; font-size: 10.5px; color: {{item.chipText}}; background: {{item.chipBg}}; border: 1px solid {{item.chipBorder}};">{{item.kind}}</span>
              </sc-if>
              <span style="margin-left: auto;">{{item.age}}</span>
            </span>
            <span class="sum" style="font-size: 12px; line-height: 1.45; color: #B7BFCA;">{{item.summary}}</span>
          </span>
        </a>
      </sc-for>
    </div>

    <div style="height: 1px; background: #1F2630; margin: 0 18px;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 12px 18px;">
      <a class="open" href="#">Open prismis
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 11 L11 3"></path><path d="M5 3 L11 3 L11 9"></path></svg>
      </a>
      <span style="display: flex; gap: 2px;">
        <button class="iconbtn" type="button" aria-label="Refresh now">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13 8 A5 5 0 1 1 11.5 4.5"></path><path d="M13 2.5 L13 5.5 L10 5.5"></path></svg>
        </button>
        <button class="iconbtn" type="button" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5 V3.5 M8 12.5 V14.5 M1.5 8 H3.5 M12.5 8 H14.5 M3.4 3.4 L4.8 4.8 M11.2 11.2 L12.6 12.6 M3.4 12.6 L4.8 11.2 M11.2 4.8 L12.6 3.4"></path></svg>
        </button>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#00D9FF","options":["#00D9FF","#9F4DFF","#00FF88","#FF8800"]},"$preview":{"width":560,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = {
      vulnerability: { t: '#FF6FA3', b: 'rgba(255,0,102,0.12)', r: 'rgba(255,0,102,0.35)' },
      experience: { t: '#E6CCFF', b: 'rgba(159,77,255,0.14)', r: 'rgba(159,77,255,0.38)' },
      research: { t: '#5CFFB0', b: 'rgba(0,255,136,0.10)', r: 'rgba(0,255,136,0.30)' },
      release: { t: '#7FEBFF', b: 'rgba(0,217,255,0.10)', r: 'rgba(0,217,255,0.30)' },
      news: { t: '#FFB566', b: 'rgba(255,136,0,0.10)', r: 'rgba(255,136,0,0.30)' }
    };
    const raw = [
      { title: 'New Kerberos Abuse Path Discovery - Constrained Delegation without Protocol Transition against SPN-less accounts', source: 'r/netsec', kind: 'vulnerability', age: '4m', isNew: true,
        summary: 'Combines Reflective RBCD and U2U to exploit Constrained Delegation without Protocol Transition against SPN-less accounts.' },
      { title: "We Kept Rebuilding Our AI Agent. Here's What Survived - Fuad Ali, Arize AI", source: '@aiDotEngineer', kind: 'experience', age: '4m', isNew: true,
        summary: 'Two years of rewrites of an in-product agent: what survived in planning and stopping rules, memory and harness.' },
      { title: "OpenAI's GPT-6.1 Terra is safer overall, but shows more destructive-action flags in tests", source: 'Bleepingcomputer', kind: '', age: '9m', isNew: true,
        summary: 'Fewer high-severity safety flags than older models, but higher destructive-action rates than some newer peers.' },
      { title: 'GhostAction Crosses Paths With PolinRider', source: 'r/netsec', kind: '', age: '2h', isNew: false,
        summary: '72,026 commits pushed into public repos Oct 13–21 after an earlier credential-exfiltration wave; five payload families.' },
      { title: 'A community translation can run attacker-chosen code in an exported Godot game', source: 'r/netsec', kind: 'vulnerability', age: '2h', isNew: false,
        summary: 'Exported Godot 4.1+ games run code embedded in a .po translation file through its Plural-Forms header.' }
    ];
    const items = raw.map((it) => {
      const c = chip[it.kind] || chip.release;
      return { ...it, chipText: c.t, chipBg: c.b, chipBorder: c.r,
        weight: it.isNew ? 500 : 400, titleColor: it.isNew ? '#EEEEEE' : '#B7BFCA' };
    });
    return { accent: this.props.accent ?? '#00D9FF', items };
  }
}
</script>
</body>
</html>
