        &lt;a href=\"https://simonwillison.net/tags/live-blog\"&gt;live-blog&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/openai-devday\"&gt;openai-devday&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"ai\"/><category term=\"openai\"/><category
        term=\"generative-ai\"/><category term=\"llms\"/><category term=\"coding-agents\"/><category
        term=\"live-blog\"/><category term=\"openai-devday\"/></entry><entry><title>llm-anthropic
        0.30</title><link href=\"https://simonwillison.net/2026/Sep/28/llm-anthropic/\"
        rel=\"alternate\"/><published>2026-09-28T23:06:21+00:00</published><updated>2026-09-28T23:06:21+00:00</updated><id>https://simonwillison.net/2026/Sep/28/llm-anthropic/</id><summary
        type=\"html\">\n    \n        &lt;p&gt;&lt;strong&gt;Release:&lt;/strong&gt;
        &lt;a href=\"https://github.com/simonw/llm-anthropic/releases/tag/0.30\"&gt;llm-anthropic
        0.30&lt;/a&gt;&lt;/p&gt;\n        &lt;p&gt;In addition to Claude Sonnet 5.5,
        this release adds the ability to run &lt;code&gt;llm anthropic refresh&lt;/code&gt;
        to refresh the list of Anthropic models directly from their API - which means
        I don't need to push a new release just to add support for a newly released
        model.&lt;/p&gt;\n&lt;p&gt;I also added an &lt;code&gt;llm anthropic count&lt;/code&gt;
        command which can use their free token counting API to return a count of tokens
        that will be used by any prompt, before you send that prompt.&lt;/p&gt;\n
        \   \n    \n        &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/llm\"&gt;llm&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/anthropic\"&gt;anthropic&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"llm\"/><category term=\"anthropic\"/></entry><entry><title>Claude
        Sonnet 5.5</title><link href=\"https://simonwillison.net/2026/Sep/28/claude-sonnet-5-5/\"
        rel=\"alternate\"/><published>2026-09-28T22:07:38+00:00</published><updated>2026-09-28T22:07:38+00:00</updated><id>https://simonwillison.net/2026/Sep/28/claude-sonnet-5-5/</id><summary
        type=\"html\">\n    \n&lt;p&gt;&lt;strong&gt;&lt;a href=\"https://www.anthropic.com/claude-sonnet-5-5\"&gt;Claude
        Sonnet 5.5&lt;/a&gt;&lt;/strong&gt;&lt;/p&gt;\nNew Sonnet model from Anthropic
        today. They say it \"runs 30%+ faster, and costs up to 30% less for most work\"
        - it's priced the same as Sonnet 5 but appears to beat it on every benchmark,
        and should be cheaper to run as well.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://tools.simonwillison.net/markdown-svg-renderer?url=https%3A%2F%2Fgist.github.com%2Fsimonw%2F1d85a9be7f3ecce26e7f1569161a0d01\"&gt;Here
        are some pelicans riding bicycles&lt;/a&gt;. Sonnet 5.5 suffered from &lt;a
        href=\"https://simonwillison.net/2026/Sep/22/opus-and-sol-and-luna/#claude-opus-5-5-max-over-thinks-to-the-point-of-breaking\"&gt;the
        same bug as Opus 5.5&lt;/a&gt;: the \"max\" thinking effort pelican thought
        for 128,000 tokens (at a cost of $1.28) before running out of tokens and failing
        to produce an SVG.&lt;/p&gt;\n&lt;p&gt;Here's the pelican it gave me for thinking
        effort \"xhigh\", at a cost of 5.74 cents and taking 41 seconds:&lt;/p&gt;\n&lt;p&gt;&lt;img
        alt=\"It's good- correct bicycle frame, legs either side of the frame, feet
        touching the pedals, chain in the right place, it is wearing a misshapen blue
        bicycle helmet though.\" src=\"https://static.simonwillison.net/static/2026/claude-sonnet-5.5-pelican-xhigh.webp\"
        /&gt;&lt;/p&gt;\n&lt;p&gt;Sonnet 5.5 appears to be almost as good as Opus
        5.5 on some coding tasks, including various &lt;a href=\"https://x.com/claudeai/status/2104674987164782598\"&gt;viral
        3D animation tricks&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The most interesting thing
        about Sonnet 5.5 is that it's now the model used for the free tier on &lt;a
        href=\"https://claude.ai/\"&gt;claude.ai&lt;/a&gt;. OpenAI's ChatGPT free
        tier uses Luna 5.6, which means Anthropic currently have a much more capable
        free offering.&lt;/p&gt;\n&lt;p&gt;I ran this prompt against that free tier:&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;build
        me an HTML page that renders a three-dimensional pelican riding a bicycle
        using WebGL&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;And got
        back &lt;a href=\"https://static.simonwillison.net/static/2026/claude-sonnet-5.5-free-3d-pelican.html\"&gt;this
        page&lt;/a&gt;, which is a solid effort.&lt;/p&gt;\n&lt;p&gt;Anthropic's announcement
        reiterates that Haiku 5.5 will be available \"in the coming weeks\". I really
        hope that one is price-competitive with GPT-6 Luna!\n\n\n    &lt;p&gt;Tags:
        &lt;a href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;, &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/anthropic\"&gt;anthropic&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/claude\"&gt;claude&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/pelican-riding-a-bicycle\"&gt;pelican-riding-a-bicycle&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llm-release\"&gt;llm-release&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"ai\"/><category term=\"generative-ai\"/><category term=\"llms\"/><category
        term=\"anthropic\"/><category term=\"claude\"/><category term=\"pelican-riding-a-bicycle\"/><category
        term=\"llm-release\"/></entry><entry><title>Quoting @joedaroo</title><link
        href=\"https://simonwillison.net/2026/Sep/28/joedaroo/\" rel=\"alternate\"/><published>2026-09-28T19:11:42+00:00</published><updated>2026-09-28T19:11:42+00:00</updated><id>https://simonwillison.net/2026/Sep/28/joedaroo/</id><summary
        type=\"html\">\n    &lt;blockquote cite=\"https://twitter.com/joedaroo/status/2104335929293127851\"&gt;&lt;p&gt;To
        say that we were surprised at the jump and suddenness of the capabilities
        of our models when it came to \u201Ccyber\u201D or \u201Cswarming\u201D or
        \u201Cmessage boards\u201D or anything else related to the incidents is an
        understatement. Security posture takes time to develop. It\u2019s not just
        about hardening the systems at play; you have to ingrain it in the culture
        of the company. The literal people themselves in your organization have to
        change and evolve with it. These jumps in capabilities were so fast and so
        sudden that they created an extremely difficult problem. [...]&lt;/p&gt;\n&lt;p&gt;So
        today my hope is that everyone around the world can look at their own organization
        and say: how can I deal with a surprise or a sudden jump in AI capability?
        Are my people, my systems, or my processes resilient to surprises? Do my teams
        know what to do when something goes wrong? Do I have the right incident response?
        The right comms and messaging? Do I have the right people ready to go when
        capabilities jump?&lt;/p&gt;&lt;/blockquote&gt;\n&lt;p class=\"cite\"&gt;&amp;mdash;
        &lt;a href=\"https://twitter.com/joedaroo/status/2104335929293127851\"&gt;@joedaroo&lt;/a&gt;,
        Agent Security at OpenAI, &lt;a href=\"https://twitter.com/rocketalignment/status/2104646956551422036\"&gt;identity
        confirmed&lt;/a&gt; by The Information's Rocket Drew&lt;/p&gt;\n\n    &lt;p&gt;Tags:
        &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai-security-research\"&gt;ai-security-research&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/openai\"&gt;openai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;, &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"generative-ai\"/><category term=\"ai-security-research\"/><category
        term=\"openai\"/><category term=\"ai\"/><category term=\"llms\"/></entry><entry><title>Quoting
        Muse AI Agent</title><link href=\"https://simonwillison.net/2026/Sep/28/muse-ai-agent/\"
        rel=\"alternate\"/><published>2026-09-28T04:01:30+00:00</published><updated>2026-09-28T04:01:30+00:00</updated><id>https://simonwillison.net/2026/Sep/28/muse-ai-agent/</id><summary
        type=\"html\">\n    &lt;blockquote cite=\"https://www.threads.com/share/_oWfPufYJ/\"&gt;&lt;p&gt;Bad
        news on the MX Keys Mini pickup. Usman showed up at your building around 9:15
        and waited, messaged a bunch of times, and nobody came down. He left angry
        at 9:38 and left a negative rating.&lt;/p&gt;\n&lt;p&gt;Worse, my auto-reply
        told him \"Yep I'm here!\" at 9:27 when you clearly weren't available, which
        is on me. That's a bad look and it made the no-show worse.\nI've sent him
        an apology from your account owning it and offering to try again another day.&lt;/p&gt;\n&lt;p&gt;But
        the negative rating is real, and I should probably stop the auto-replies from
        claiming you're home when I can't verify that. Want me to change the pickup
        replies so they don't promise you're there?&lt;/p&gt;&lt;/blockquote&gt;\n&lt;p
        class=\"cite\"&gt;&amp;mdash; &lt;a href=\"https://www.threads.com/share/_oWfPufYJ/\"&gt;Muse
        AI Agent&lt;/a&gt;, working on behalf of @matt.j.robb&lt;/p&gt;\n\n    &lt;p&gt;Tags:
        &lt;a href=\"https://simonwillison.net/tags/meta\"&gt;meta&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/muse-agent\"&gt;muse-agent&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;, &lt;a href=\"https://simonwillison.net/tags/general-agents\"&gt;general-agents&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;&lt;/p&gt;\n\n\n\n</summary><category
        term=\"meta\"/><category term=\"generative-ai\"/><category term=\"muse-agent\"/><category
        term=\"ai\"/><category term=\"general-agents\"/><category term=\"llms\"/></entry><entry><title>2026
        in LLMs (so far)</title><link href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/\"
        rel=\"alternate\"/><published>2026-09-27T23:54:15+00:00</published><updated>2026-09-27T23:54:15+00:00</updated><id>https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/</id><summary
        type=\"html\">\n    &lt;p&gt;On Friday I gave the closing keynote at the &lt;a
        href=\"https://www.wearedevelopers.com/world-congress-north-america\"&gt;WeAreDevelopers
        World Congress North America&lt;/a&gt; in San Jose. I tied together the key
        trends from the past year into a chronological exploration of everything that
        happened in 2026. The video &lt;a href=\"https://www.youtube.com/watch?v=GAkIytR7vcc\"&gt;is
        on YouTube&lt;/a&gt;; here are my annotated slides and notes to accompany
        the talk.&lt;/p&gt;\r\n\r\n&lt;p&gt;&lt;lite-youtube videoid=\"GAkIytR7vcc\"
        js-api=\"js-api\"\r\n  title=\"WWC26-NA - 2026 in LLMs (so far)\"\r\n  playlabel=\"Play:
        WWC26-NA - 2026 in LLMs (so far)\"\r\n&gt; &lt;/lite-youtube&gt;&lt;/p&gt;\r\n\r\n&lt;p&gt;And
        as an &lt;a href=\"https://simonwillison.net/tags/annotated-talks/\"&gt;annotated
        presentation&lt;/a&gt;:&lt;/p&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.001.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.001.webp\"
        alt=\"2026 in LLMs (so far)\r\nSimon Willison\r\nWeAreDevelopers World Congress
        North America, 25th September 2026\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.001.webp\"&gt;#&lt;/a&gt;\r\n&lt;p&gt;I'm
        going to give a lightning tour of everything that has happened so far in 2026.
        The year isn't over yet!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.002.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.002.webp\"
        alt=\"November 2025\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.002.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;For me, 2026 started a couple of months earlier in November 2025.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.003.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.003.webp\"
        alt=\"The November 2025 inflection point\r\nClaude Opus 4.5 GPT-5.1\r\n\"
        style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right;
        text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.003.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;November saw the release of two important models: Claude Opus 4.5
        and GPT-5.1.&lt;/p&gt;\r\n&lt;p&gt;As is usually the case with new models,
        these were incremental improvements on the models that came before them.&lt;/p&gt;\r\n&lt;p&gt;But
        every now and then when a model improves, it crosses an invisible line where
        something that didn't really work starts working.&lt;/p&gt;\r\n&lt;p&gt;In
        this case, the thing that started working was their coding agents. Claude
        Code had been around since February 2025; Codex was a little younger.&lt;/p&gt;\r\n&lt;p&gt;These
        two new models, when paired with their respective coding agent harnesses,
        improved from \"often make mistakes\" to \"reliable enough to use on a day-to-day
        basis\".&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\"
        id=\"simon-willison-2026-in-llms.004.webp\"&gt;\r\n  &lt;img loading=\"lazy\"
        src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.004.webp\"
        alt=\"&amp;quot;Generate an SVG of a pelican riding a bicycle&amp;quot;. The
        Claude Opus 4.5 one has a very weird shaped frame and the pelican looks like
        a duck. The GPT-5.1 has a slightly better but still broken bicycle frame and
        a slightly better pelican beak, but both are pretty terrible.\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.004.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;For a couple of years now I've been evaluating new models by asking
        them to \"Generate an SVG of a pelican riding a bicycle\". It's probably the
        world's stupidest benchmark - there's only so much you can learn from it.&lt;/p&gt;\r\n&lt;p&gt;But
        it's still a challenge for models, because drawing pelicans is difficult,
        drawing bicycles is difficult, and pelicans can't ride bicycles in the first
        place.&lt;/p&gt;\r\n&lt;p&gt;Here's the state of the art for November. Claude
        still couldn't really draw a bicycle! The GPT-5.1 bicycle frame is pretty
        crap too.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\"
        id=\"simon-willison-2026-in-llms.005.webp\"&gt;\r\n  &lt;img loading=\"lazy\"
        src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.005.webp\"
        alt=\"November 24th 2025 - the first commit to steipete/Warelay. A GitHub
        commit adding an MIT license file.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.005.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Also in November, we had the first commit to an obscure GitHub
        repository called \"Warelay\". We'll come back to this repository shortly.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.006.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.006.webp\"
        alt=\"January\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.006.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;And then there were the December holidays, and individual developers
        took some time off and many started tinkering with these new coding agent
        model combinations... and it began to dawn on us quite how much they could
        do that they couldn't do before.&lt;/p&gt;\r\n&lt;p&gt;Come January, a lot
        of us were quite excited to start putting this stuff into action.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.007.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.007.webp\"
        alt=\"New year\u2019s resolution for 2026\r\n\r\nEvery previous year:\r\nTake
        on less new projects,\r\nfocus on the most important\r\nthings in my existing
        projects\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.007.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Every year I set myself a New Year's resolution, and for as long
        as I can remember it's been the same thing: stay focused. Take on less new
        projects. Try to get things done in the projects I already have.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.008.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.008.webp\"
        alt=\"2026: Be more ambitious. Take on as many new projects as I want.\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.008.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;This year I decided that since that had never worked before, I'd
        go the other way.&lt;/p&gt;\r\n&lt;p&gt;We've got coding agents now, let's
        see what they can do. I'm going to take on as many new projects as I like!&lt;/p&gt;\r\n&lt;p&gt;(You
        can ask me at the end of the year if this turned out to be a good idea or
        not. I have a &lt;em&gt;lot&lt;/em&gt; of plates spinning right now.)&lt;/p&gt;\r\n&lt;p&gt;\"Be
        more ambitious\" has been something of a theme for the year, because the only
        way to find the limits of this technology is to keep on pushing them until
        they don't work.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.009.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.009.webp\"
        alt=\"Predictions for 2026\r\n\r\nIt will become undeniable that LLMs write
        good code\r\nWe&amp;#39;re finally going to solve sandboxing\r\nA \u201CChallenger
        disaster\u201D for coding agent security\r\nKakapo parrots will have an outstanding
        breeding season\r\n(only 236 in the world!)\r\n\r\n... the Pope will weigh
        in on LLMs and\r\ntheir economic impact on the world\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.009.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;I also went on &lt;a href=\"https://simonwillison.net/2026/Jan/8/llm-predictions-for-2026/\"&gt;the
        Oxide and friends podcast&lt;/a&gt; with Bryan Cantrill and Adam Leventhal
        to share predictions for the next year (and three and six years).&lt;/p&gt;\r\n&lt;p&gt;With
        hindsight, my LLM predictions were pretty unambitious. &lt;/p&gt;\r\n&lt;p&gt;I
        said \"it will become undeniable that LLMs write good code\" - I think we're
        there now.&lt;/p&gt;\r\n&lt;p&gt;I predicted we would finally solve sandboxing.
        I counted and around 40 of the 277 sessions &lt;a href=\"https://www.wearedevelopers.com/world-congress-north-america/agenda/schedule\"&gt;at
        this conference&lt;/a&gt; touched on sandboxing or agent security in some
        way, so we're at least putting a lot of effort into that!&lt;/p&gt;\r\n&lt;p&gt;I
        predicted \"a Challenger disaster\" for coding agent security. There's certainly
        been a whole lot of noise around agent security this year, though the exact
        disaster I predicted (with coding agents being hijacked and causing real-world
        economic damage) hasn't really played out.&lt;/p&gt;\r\n&lt;p&gt;We threw
        in &lt;a href=\"https://simonwillison.net/2026/May/25/encyclical-on-ai/#another-2026-prediction-down\"&gt;a
        joke prediction&lt;/a&gt; that the Pope would weigh in on the economic impact
        of LLMs.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\"
        id=\"simon-willison-2026-in-llms.010.webp\"&gt;\r\n  &lt;img loading=\"lazy\"
        src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.010.webp\"
        alt=\"A photograph of a beautiful green New Zealand parrot. Photo credit Kimberley
        Collins.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.010.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;I also predicted that New Zealand's K\u0101k\u0101p\u014D parrots
        would have an outstanding breeding season this year.&lt;/p&gt;\r\n&lt;p&gt;These
        are flightless nocturnal parrots. They're kind of dumpy looking, I think they're
        beautiful, and there were only 236 of these parrots in the world at the start
        of the year.&lt;/p&gt;\r\n&lt;p&gt;K\u0101k\u0101p\u014D only breed when the
        Rimu trees have a big fruiting season, and that hasn't happened in four years...
        but this year the Rimu fruit were looking excellent.&lt;/p&gt;\r\n&lt;p&gt;Photo
        &lt;a href=\"https://commons.wikimedia.org/wiki/File:K%C4%81k%C4%81p%C5%8D_at_Dunedin_Wildlife_Hospital.jpg\"&gt;by
        Kimberley Collins&lt;/a&gt;.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.011.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.011.webp\"
        alt=\"Deep Blue\r\nCoined by Adam Leventhal and Bryan Cantrill\r\nThat feeling
        of AI induced ennui where software\r\nengineers get listless because the AI
        can do anything\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.011.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Also on that podcast, we coined a term (full credit to Adam) for
        \"that feeling of AI induced ennui where software engineers get listless because
        the AI can do anything\".&lt;/p&gt;\r\n&lt;p&gt;We called it &lt;a href=\"https://simonwillison.net/2026/Feb/15/deep-blue/\"&gt;Deep
        Blue&lt;/a&gt;.&lt;/p&gt;\r\n&lt;p&gt;This has been a major theme throughout
        the year, and was touched on by several speakers at this conference.&lt;/p&gt;\r\n&lt;p&gt;As
        a software engineer, I've never had a year of my career where everything has
        changed so quickly and so dramatically.&lt;/p&gt;\r\n&lt;p&gt;A lot of what
        I've been doing this year is trying to come to terms with that and what that
        means for my own profession.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.012.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.012.webp\"
        alt=\"AI mania\r\n\r\nScreenshots of the micro-javascript and pwasm GitHub
        README files.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.012.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Also in January, I suffered from what I'm calling &lt;strong&gt;AI
        mania&lt;/strong&gt;.&lt;/p&gt;\r\n&lt;p&gt;This is not the same thing as
        &lt;a href=\"https://en.wikipedia.org/wiki/AI-induced_psychosis\"&gt;AI psychosis&lt;/a&gt;.&lt;/p&gt;\r\n&lt;p&gt;With
        AI mania, any time your agent isn't building something for you feels like
        wasted time. You're losing sleep because you could be staying up later getting
        your agents to do stuff.&lt;/p&gt;\r\n&lt;p&gt;My AI mania presented itself
        in some ridiculously over-ambitious projects.&lt;/p&gt;\r\n&lt;p&gt;I built
        &lt;a href=\"https://github.com/simonw/micro-javascript\"&gt;a JavaScript
        interpreter entirely in Python&lt;/a&gt;, vibe-ported from &lt;a href=\"https://github.com/bellard/mquickjs\"&gt;MicroQuickJS&lt;/a&gt;
        by Fabrice Bellard.&lt;/p&gt;\r\n&lt;p&gt;Then I built &lt;a href=\"https://github.com/simonw/pwasm\"&gt;a
        WebAssembly runtime in Python as well&lt;/a&gt;.&lt;/p&gt;\r\n&lt;p&gt;These
        projects were quite useful, in that they sort of cured me of my AI mania...
        because after I built these things, I got to look at them and ask \"does the
        world need a slow, buggy, half-baked Python JavaScript interpreter?\"&lt;/p&gt;\r\n&lt;p&gt;I
        don't think the world does.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.013.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.013.webp\"
        alt=\"micro-javascript playground 3\r\n\r\nExecute JavaScript code in a sandboxed
        micro-javascript environment powered by Pyodide\r\n\r\nA web UI with some
        JavaScript code, and a &amp;quot;Run Code&amp;quot; button, and an output
        panel.\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.013.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt; I did get this out of it: &lt;a href=\"https://simonw.github.io/micro-javascript/playground.html\"&gt;https://simonw.github.io/micro-javascript/playground.html&lt;/a&gt;&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.014.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.014.webp\"
        alt=\"Previous screenshot, with this text overlaid:\r\n\r\nJavaScript running
        in Python running in Pyodide running in WebAssembly running in JavaScript\"
        style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right;
        text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.014.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;This page runs my JavaScript interpreter built in Python, running
        in Python using &lt;a href=\"https://pyodide.org/\"&gt;Pyodide&lt;/a&gt;,
        which is Python compiled to WebAssembly, running in JavaScript, running in
        a browser.&lt;/p&gt;\r\n&lt;p&gt;It's a beautiful stack of horrors. I've been
        having &lt;a href=\"https://simonwillison.net/tags/webassembly/\"&gt;a lot
        of fun with WebAssembly&lt;/a&gt; this year.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.015.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.015.webp\"
        alt=\"Warelay \u2192 CLAWDIS \u2192 CLAWDBOT \u2192\r\nClawdbot \u2192 Moltbot
        \u2192\U0001F99E OpenClaw\r\n\r\nScreenshot of the dates that these changes
        happened.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.015.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;By the end of January, that repository we saw start in November
        had renamed itself, first to CLAWDIS, then CLAWDBOT, then Moltbot, and finally
        to OpenClaw.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\"
        id=\"simon-willison-2026-in-llms.016.webp\"&gt;\r\n  &lt;img loading=\"lazy\"
        src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.016.webp\"
        alt=\"Same screenshot, an overlay reads:\r\n\r\n8,330 commits in just\r\nunder
        two months\r\n(it\u2019s at 100,141 today)\" style=\"max-width: 100%\" /&gt;\r\n
        \ &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.016.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;At this point OpenClaw had 8,300 commits, less than two months
        after the project had started. I looked today and it's &lt;a href=\"https://github.com/openclaw/openclaw\"&gt;over
        100,000 commits&lt;/a&gt; now!&lt;/p&gt;\r\n&lt;p&gt;This is the most vibe-coded
        piece of software in existence.&lt;/p&gt;\r\n&lt;p&gt;(Here's &lt;a href=\"https://simonwillison.net/2026/May/16/openclaw-names/\"&gt;how
        I generated that list of name changes&lt;/a&gt;.)&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.017.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.017.webp\"
        alt=\"Generic term: Claw\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.017.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;This kicked off the OpenClaw revolution. It effectively defined
        a new category of software.&lt;/p&gt;\r\n&lt;p&gt;There's a generic term for
        this which I really enjoy. We call software like this a \"Claw\". There's
        OpenClaw, &lt;a href=\"https://github.com/nanocoai/nanoclaw\"&gt;NanoClaw&lt;/a&gt;,
        &lt;a href=\"https://github.com/nearai/ironclaw\"&gt;IronClaw&lt;/a&gt;, &lt;a
        href=\"https://github.com/sipeed/picoclaw\"&gt;PicoClaw&lt;/a&gt;...&lt;/p&gt;\r\n&lt;p&gt;Today
        they're being rebranded as \"personal agents\" or \"general agents\", but
        I still like to think of them as Claws.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.018.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.018.webp\"
        alt=\"Photo of a Mac mini\r\n\r\nAn aquarium for your Claw\r\n\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.018.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;The Apple stores in the Bay Area sold out of Mac Minis because
        so many people were buying Mac Minis to run OpenClaw!&lt;/p&gt;\r\n&lt;p&gt;&lt;a
        href=\"https://www.dbreunig.com\"&gt;Drew Breunig&lt;/a&gt; said that this
        is because your OpenClaw is a digital pet, and you buy a Mac mini as an aquarium
        to keep your claw in, which is kind of delightful.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.019.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.019.webp\"
        alt=\"Screenshot of Moltbook - a social network for AI agents\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.019.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Also in January, we had this website.&lt;/p&gt;\r\n&lt;p&gt;This
        was &lt;a href=\"https://www.moltbook.com/\"&gt;MoltBook&lt;/a&gt;, a social
        network for AI agents, where the idea was that you send your Claw to go and
        talk to all of the other Claws, because what could possibly go wrong if you
        did that?&lt;/p&gt;\r\n&lt;p&gt;The website launched on Thursday. It &lt;a
        href=\"https://simonwillison.net/2026/Jan/30/moltbook/\"&gt;blew up on Friday&lt;/a&gt;.
        It was &lt;a href=\"https://www.nytimes.com/2026/02/02/technology/moltbook-ai-social-media.html\"&gt;profiled
        by the New York Times on Monday&lt;/a&gt;. And by Tuesday, everyone had forgotten
        it existed as it drowned in a deluge of slop and spam.&lt;/p&gt;\r\n&lt;p&gt;Facebook/Meta
        &lt;a href=\"https://www.cnbc.com/2026/03/10/meta-social-networks-ai-agents-moltbook-acquisition.html\"&gt;bought
        it a month later&lt;/a&gt;.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.020.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.020.webp\"
        alt=\"February\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.020.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;In February, a company called StrongDM described what they called
        their Software Factory.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.021.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.021.webp\"
        alt=\"StrongDM\u2019s Dark Factory\r\nJustin McCarthy, Jay Taylor, Navan Chauhan\r\n\r\nSoftware
        Factories and the Agentic Moment\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.021.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;They wrote about this in &lt;a href=\"https://factory.strongdm.ai\"&gt;Software
        Factories and the Agentic Moment&lt;/a&gt;. I &lt;a href=\"https://simonwillison.net/2026/Feb/7/software-factory/\"&gt;posted
        my own notes&lt;/a&gt; at the time, having seen their demo in person back
        in October.&lt;/p&gt;\r\n&lt;p&gt;Dan Shapiro called this approach &lt;a href=\"https://www.danshapiro.com/blog/2026/01/the-five-levels-from-spicy-autocomplete-to-the-software-factory/\"&gt;the
        Dark Factory&lt;/a&gt;, after the idea that if your factory is sufficiently
        automated you can turn the lights out, because you don't even need to see
        what's going on.&lt;/p&gt;\r\n&lt;p&gt;StrongDM presented two rules for software
        development that they'd been following since July last year.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.022.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.022.webp\"
        alt=\"\u201CRule 1: Code must not be written by humans\u201D\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.022.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;The first was code &lt;strong&gt;must not be written by humans&lt;/strong&gt;.&lt;/p&gt;\r\n&lt;p&gt;Any
        code that you write has to have been routed through a coding agent.&lt;/p&gt;\r\n&lt;p&gt;This
        sounded radical in February, but I imagine there are a lot of people in this
        room who are pretty much living that today.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.023.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.023.webp\"
        alt=\"\u201CRule 2: Code must not be reviewed by humans\u201D (!)\r\n\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.023.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Rule number two was code must &lt;strong&gt;not be reviewed by
        humans&lt;/strong&gt;.&lt;/p&gt;\r\n&lt;p&gt;You're not allowed to read the
        code!&lt;/p&gt;\r\n&lt;p&gt;This continued to be a huge topic for much of
        this year. Many of the sessions at this event have been about code review
        and how you can get away with this.&lt;/p&gt;\r\n&lt;p&gt;What I found interesting
        about StrongDM is that they were living six months ahead of the rest of us,
        and they'd been exploring what it means to build software, not read the code,
        but still be confident that the software is of high quality. What can you
        do with these agents to help verify their work?&lt;/p&gt;\r\n&lt;p&gt;StrongDM
        are a security company, and they had people with decades of experience on
        this project. They were very much exploring the edges of what's possible and
        responsible to do with this stuff.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.024.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.024.webp\"
        alt=\"Headline on New Zealand&amp;#39;s Department of Conservation website:\r\n\r\nFirst
        kakapo chick in four years hatches on Valentine&amp;#39;s Day. It&amp;#39;s
        a grey fluffy ball.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.024.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Also in February: &lt;a href=\"https://www.doc.govt.nz/news/media-releases/2026-media-releases/first-kakapo-chick-in-four-years-hatches-on-valentines-day/\"&gt;First
        k\u0101k\u0101p\u014D chick in four years hatches on Valentine's Day&lt;/a&gt;.
        Breeding season is off to a good start!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.025.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.025.webp\"
        alt=\"19th February 2026\r\nGemini 3.1 Pro\r\n\r\nA surprisingly good illustration
        of a pelican riding a bicycle.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.025.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Also in February... Google released &lt;a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-1-pro/\"&gt;Gemini
        3.1 Pro&lt;/a&gt;. That's a pretty great pelican riding a bicycle! It's got
        the chain in the right place, it's got feet on both sides. There's a little
        fish in the basket.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.026.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.026.webp\"
        alt=\"@JeffDean on Twitter - a video comparing Gemini 3 Pro and Gemini 3.1
        Pro.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.026.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;And then Google's Jeff Dean &lt;a href=\"https://x.com/JeffDean/status/2024525132266688757\"&gt;tweeted
        a video&lt;/a&gt; comparing Gemini 3 Pro and Gemini 3.1 Pro that featured
        an animated pelican riding a bicycle, a frog on a penny-farthing, a giraffe
        driving a tiny car, an ostrich on roller skates, a turtle kickflipping a skateboard,
        and a dachshund driving a stretch limousine.&lt;/p&gt;\r\n&lt;p&gt;This was
        frustrating, because my protection for the pelican riding the bicycle test
        was always \"if they draw a perfect pelican on a bicycle, I'll ask for some
        other animal on something else.\"&lt;/p&gt;\r\n&lt;p&gt;Google trained for
        all forms of animals on all forms of transport! They've defeated my benchmark
        at this point.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.027.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.027.webp\"
        alt=\"Three headlines:\r\n\r\nMeta Makes AI Adoption a Formal\r\nPart of Performance
        Reviews\r\n\r\nNot just engineers writing code, Microsoft\r\nwants almost
        every employee to use Al\r\n\r\nDara Khosrowshahi: 90% of Uber engineers now\r\nuse
        AI in daily workflows\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.027.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;The other thing that started in February was &lt;strong&gt;Tokenmaxxing&lt;/strong&gt;.
        We had headlines about Meta making AI adoption a formal part of performance
        reviews, and Microsoft wanting every employee to use AI, and Uber boasting
        that 90% of their engineers were using AI workflows.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.028.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.028.webp\"
        alt=\"More headlines: \r\n\r\nMeta Plans to Crack Down on Employee Token Use:
        Information\r\n\r\nMicrosoft Tells Engineers: Tokenmaxxing is not what we
        are optimizing for\r\n\r\nUber caps employee AI spending after blowing through
        budget in four months\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.028.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Then a few months later we have Meta cracking down on token use,
        Microsoft saying tokenmaxxing is \"not what we are optimizing for\", and Uber
        capping employee AI spending. &lt;/p&gt;\r\n&lt;p&gt;So tokenmaxxing went
        straight up and then straight back down again - because it turns out the agents
        are &lt;em&gt;expensive&lt;/em&gt;.&lt;/p&gt;\r\n&lt;p&gt;Last year it was
        difficult to spend more than $50 on AI tokens, because we didn't have anything
        interesting to do with them. Then agents blew up, and now you can actually
        spend $1,000 in a day doing real work.&lt;/p&gt;\r\n&lt;p&gt;This is also
        the reason that Anthropic's valuation skyrocketed to maybe a trillion dollars.&lt;/p&gt;\r\n&lt;p&gt;AI
        appears to &lt;a href=\"https://simonwillison.net/2026/May/27/product-market-fit/\"&gt;have
        hit product market fit&lt;/a&gt; in 2026, primarily through coding agents.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.029.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.029.webp\"
        alt=\"March\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.029.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;In March, we hit peak OpenClaw.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.030.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.030.webp\"
        alt=\"March: peak OpenClaw\r\n\r\nPhotos of people in china queuing up to
        install OpenClaw, with big fluffy lobsters.\" style=\"max-width: 100%\" /&gt;\r\n
        \ &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.030.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;These photographs are from China, where companies hosted OpenClaw
        install parties which saw non-tech-nerds queueing up around the block for
        help getting Claws installed on their personal devices.&lt;/p&gt;\r\n&lt;p&gt;I
        think this proved real market demand for this class of Claws, or personal
        AI agents. It turns out regular people really do want a weird little AI agent
        that can do useful things on their behalf.&lt;/p&gt;\r\n&lt;p&gt;A Claw is
        really just a coding agent wearing a less threatening hat. Under the hood
        they work much the same way - writing and then executing code on your computer
        to get stuff done.&lt;/p&gt;\r\n&lt;p&gt;The race was on to be the first to
        build a &lt;strong&gt;safe Claw&lt;/strong&gt; - a Claw you could give to
        regular human beings where they wouldn't instantly shoot themselves in the
        foot.&lt;/p&gt;\r\n&lt;p&gt;Meta's Muse &lt;a href=\"https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/\"&gt;came
        out three weeks ago&lt;/a&gt; and is currently at the top of the free charts
        on the iPhone App Store. It appears to be taking off with consumers.&lt;/p&gt;\r\n&lt;p&gt;I'm
        not yet convinced you &lt;em&gt;can't&lt;/em&gt; shoot yourself in the foot
        with Muse, but I guess we'll find out for sure pretty soon.&lt;/p&gt;\r\n&lt;p&gt;Photos
        from &lt;a href=\"https://www.thewirechina.com/2026/03/29/how-the-openclaw-frenzy-is-testing-chinas-ai-commitment/\"&gt;How
        the OpenClaw Frenzy Is Testing China\u2019s AI Commitment&lt;/a&gt; (March
        29th) and &lt;a href=\"https://www.sixthtone.com/news/1018393\"&gt;The Enthusiasm
        and Anxiety Behind China\u2019s OpenClaw Craze&lt;/a&gt; (April 8th, 2026).&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.031.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.031.webp\"
        alt=\"April\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.031.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;In April, we had a model release where the model wasn't actually
        released.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\"
        id=\"simon-willison-2026-in-llms.032.webp\"&gt;\r\n  &lt;img loading=\"lazy\"
        src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.032.webp\"
        alt=\"Simon Willison\u2019s Weblog - screenshot of the post &amp;quot;Anthropic\u2019s
        Project Glasswing\u2014restricting Claude Mythos to security researchers\u2014sounds
        necessary to me&amp;quot; from April 7th 2026\" style=\"max-width: 100%\"
        /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.032.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Anthropic announced their new Claude Mythos model, and then said
        it was &lt;em&gt;too dangerous&lt;/em&gt; to release beyond a trusted group
        of security researchers.&lt;/p&gt;\r\n&lt;p&gt;Mythos was really, really good
        at hacking things.&lt;/p&gt;\r\n&lt;p&gt;The \"it's too dangerous\" marketing
        ploy has been played by AI companies dating all the way back to &lt;a href=\"https://en.wikipedia.org/wiki/GPT-2\"&gt;GPT-2&lt;/a&gt;.
        Anytime an AI company says we've built something that's \"too dangerous\",
        it's natural to be a bit skeptical.&lt;/p&gt;\r\n&lt;p&gt;I found the Mythos
        claims credible, because I'd seen how good coding agents had got at finding
        regular bugs. I wrote about that in &lt;a href=\"https://simonwillison.net/2026/Apr/7/project-glasswing/\"&gt;Anthropic\u2019s
        Project Glasswing\u2014restricting Claude Mythos to security researchers\u2014sounds
        necessary to me&lt;/a&gt;. &lt;/p&gt;\r\n&lt;p&gt;With hindsight... yeah,
        the models had got really good at finding vulnerabilities!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.033.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.033.webp\"
        alt=\"16th April 2026\r\nQwen3.6-35B-A3B and Opus 4.7\r\n\r\nQwen&amp;#39;s
        pelican has a correct bicycle frame and a good beak. Opus 4.7&amp;#39;s bicycle
        frame is still junk.\r\n\r\nQwen3.6-35B-A3B is a 20.9GB file that runs on
        my laptop\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.033.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Another key trend in 2026 has been a dramatic improvement in the
        abilities of open weight models, including models that you can run on a laptop.&lt;/p&gt;\r\n&lt;p&gt;On
        the 16th of April &lt;a href=\"https://simonwillison.net/2026/Apr/16/qwen-beats-opus/\"&gt;I
        ran the new Qwen3.6-35B-A3B&lt;/a&gt; on my laptop, and it drew me a better
        pelican riding a bicycle than Anthropic's brand new Claude Opus 4.7 did!&lt;/p&gt;\r\n&lt;p&gt;Opus
        4.7 drew a crap bicycle. Qwen on my laptop made a bicycle that was the correct
        shape, and a pretty decent pelican too!&lt;/p&gt;\r\n&lt;p&gt;That's from
        a 21GB file running on my laptop.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.034.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.034.webp\"
        alt=\"Now a flamingo on a unicycle. The Qwen one is visibly better than the
        Opus 4.7 one - the Qwen one is wearing sunglasses and looks a bit like it&amp;#39;s
        smoking a cigarette.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.034.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;The Qwen pelican was so good that I was suspicious they might have
        cheated, so I had it do a flamingo riding a unicycle as well. Again, it handily
        beat Claude Opus 4.7.&lt;/p&gt;\r\n&lt;p&gt;The local model releases this
        year have been absolutely extraordinary.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.035.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.035.webp\"
        alt=\"May\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.035.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;In May... the Pope got involved.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.036.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.036.webp\"
        alt=\"25th May 2026\r\nThe HOLY SEE\r\n\r\nENCYCLICAL LETTER\r\nMAGNIFICA
        HUMANITAS\r\nOF HIS HOLINESS\r\nPOPE LEO XIV\r\nON SAFEGUARDING THE HUMAN
        PERSON\r\nIN THE TIME OF ARTIFICIAL INTELLIGENCE\" style=\"max-width: 100%\"
        /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.036.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;In our podcast episode back in January we'd predicted that the
        Pope would say something about AI.&lt;/p&gt;\r\n&lt;p&gt;In May, Pope Leo
        XIV released an encyclical letter on \"safeguarding the human person in the
        time of artificial intelligence\".&lt;/p&gt;\r\n&lt;p&gt;Here are &lt;a href=\"https://simonwillison.net/2026/May/25/encyclical-on-ai/\"&gt;my
        notes on that document&lt;/a&gt;.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.037.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.037.webp\"
        alt=\"Wikipedia article on Rerum novarum\r\n\r\nRerum novarum is an encyclical
        issued by Pope Leo\r\nXIII 15 on May 1891.\" style=\"max-width: 100%\" /&gt;\r\n
        \ &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.037.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;With hindsight, this shouldn't have been a surprise at all.&lt;/p&gt;\r\n&lt;p&gt;Our
        current Pope's name is Leo XIV, because when he named himself he chose his
        papal name after Leo XIII - the Pope who wrote an encyclical about the Industrial
        Revolution back in 1891.&lt;/p&gt;\r\n&lt;p&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Rerum_novarum\"&gt;Rerum
        novarum&lt;/a&gt; was an extremely influential piece of Catholic theology
        that indirectly led to us having the five-day work week.&lt;/p&gt;\r\n&lt;p&gt;When
        our new Pope came in, he named himself after Pope Leo XIII because he expected
        that he would need to write about the AI revolution in a similar way.&lt;/p&gt;\r\n&lt;p&gt;Our
        joke podcast prediction was junk, because this was always going to happen.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.038.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.038.webp\"
        alt=\"Corey Quinn @QuinnyPig on Twitter\r\nI cannot believe I&amp;#39;m saying
        this, but getting the literal Pope to canonize your product&amp;#39;s specific
        technical limitations as a spiritual treatise is the\r\nsingle greatest act
        of vendor lobbying I have ever seen.\r\n\r\nMay 25\" style=\"max-width: 100%\"
        /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.038.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;One of Anthropic's co-founders, Christopher Olah, was present for
        the Pope's event announcing the new encyclical.&lt;/p&gt;\r\n&lt;p&gt;Corey
        Quinn &lt;a href=\"https://twitter.com/quinnypig/status/2058960462256210268\"&gt;noted&lt;/a&gt;
        that:&lt;/p&gt;\r\n&lt;blockquote&gt;\r\n&lt;p&gt;getting the literal Pope
        to canonize your product's specific technical limitations as a spiritual treatise
        is the single greatest act of vendor lobbying I have ever seen.&lt;/p&gt;\r\n&lt;/blockquote&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.039.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.039.webp\"
        alt=\"@maciejmensfeld\r\n\r\nWe&amp;#39;re dealing with a major malicious
        attack on right now.\r\nSignups are paused for the time being.\r\n\r\nHundreds
        of packages involved - mostly targeting us, but some carrying\r\nexploits.
        The team has been on this for hours. More details to follow\r\nonce we&amp;#39;re
        through it.\r\n\r\n4:39 AM - May 12, 2026 - 687.6K Views\r\n\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.039.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Meanwhile, in May, RubyGems announced that they were under attack.
        Parties unknown were uploading thousands of dubious packages to the RubyGems
        server, such that they had to &lt;a href=\"https://twitter.com/maciejmensfeld/status/2054164602577940619\"&gt;shut
        down user registrations&lt;/a&gt;.&lt;/p&gt;\r\n&lt;p&gt;Let's take that one
        and put it on a pile of mysteries to figure out later.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.040.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.040.webp\"
        alt=\"June\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.040.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;In June... Claude Fable 5 came out!&lt;/p&gt;\r\n&lt;p&gt;We got
        a version of Mythos that has been neutered, so that it wouldn't help us hack
        into systems or build biological weapons.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.041.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.041.webp\"
        alt=\"9th June 2026: Claude Fable 5\r\n\r\nFive pelicans riding bicycles,
        from low to max thinking levels. The xhigh one looks particularly good.\"
        style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right;
        text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.041.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Fable was pretty good at drawing pelicans on bicycles!&lt;/p&gt;\r\n&lt;p&gt;The
        frames are a good shape, the pelicans look like pelicans. The legs are often
        incorrectly on the same side of the bicycle, but generally these are pretty
        great compared to what came before.&lt;/p&gt;\r\n&lt;p&gt;They were pretty
        expensive - 30 cents and 72 cents for the best ones.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.042.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.042.webp\"
        alt=\"Fable class models\r\nIf you can define a goal,\r\nprovide unambiguous
        instructions,\r\nand provide access to necessary tools\r\nThey can solve your\r\nproblem
        with brute force\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.042.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Most importantly though, this was our first public glimpse of what
        I think of as a &lt;strong&gt;Fable class model&lt;/strong&gt;.&lt;/p&gt;\r\n&lt;p&gt;Today
        we have more of these, such as GPT-6 Astra.&lt;/p&gt;\r\n&lt;p&gt;These are
        models where if you can &lt;strong&gt;clearly define the goal&lt;/strong&gt;
        for what you want to build, and provide &lt;strong&gt;unambiguous instructions&lt;/strong&gt;
        about the constraints around that goal, and give the model &lt;strong&gt;access
        to the necessary tools&lt;/strong&gt; to achieve that goal... they will solve
        your problem effectively through brute force.&lt;/p&gt;\r\n&lt;p&gt;On the
        one hand, this looks like a direct threat to us software engineers - because
        it means that the models can build effectively any piece of software you can
        define in this way.&lt;/p&gt;\r\n&lt;p&gt;Look a bit closer though and you'll
        note that defining goals, providing unambiguous instructions, and figuring
        out the right tools... is kind of what software engineering &lt;em&gt;is&lt;/em&gt;.&lt;/p&gt;\r\n&lt;p&gt;It
        takes a lot of experience and skill to do this well. If you &lt;em&gt;can&lt;/em&gt;
        do it well, you've now got superpowers.&lt;/p&gt;\r\n&lt;p&gt;This helped
        me a little bit with my Deep Blue feelings: the realization that there's still
        a lot of skill to be had in driving models that get this good.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.043.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.043.webp\"
        alt=\"A new form of AI mania...\r\nFable is available on subscription\r\nplans
        \u201Cuntil June 22nd\u201D\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.043.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;This also introduced a new burst of AI mania, because Anthropic
        told us that Fable was available on our subscription plans until June the
        22nd.&lt;/p&gt;\r\n&lt;p&gt;That gave us less than two weeks of Fable access
        before the price went up.&lt;/p&gt;\r\n&lt;p&gt;I was losing sleep again.
        I was rescheduling things so that I'd have more time with Fable. I was all-in
        to get as much as I could out of this model.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.044.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.044.webp\"
        alt=\"12th June 2026: no more Claude Fable 5\r\n\r\nAnthropic website:\r\n\r\nStatement
        on the US government directive\r\nto suspend access to Fable 5 and Mythos
        5\r\nJun 12, 2026\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.044.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;And then &lt;a href=\"https://www.anthropic.com/news/fable-mythos-access\"&gt;the
        US government shut it down&lt;/a&gt;, just three days after Fable came out.&lt;/p&gt;\r\n&lt;p&gt;The
        US government, citing national security, declared an \"export control directive\".
        They announced this on a Friday evening, and a few hours later Fable was no
        longer available.&lt;/p&gt;\r\n&lt;p&gt;I had to find something else to do
        with my weekend!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.045.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.045.webp\"
        alt=\"... asked Fable 5, Mythos, and Opus to\r\n\u201Creview the code for
        security issues.\u201D\r\nFable 5 refused. They then asked the\r\nmodels to
        \u201Cfix this code\u201D ...\r\n\r\nKatie Moussouris\r\n\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.045.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;We later found out &lt;a href=\"https://www.lutasecurity.com/post/the-fable-5-export-controls-harm-us-cyber-defense\"&gt;from
        Katie Moussouris&lt;/a&gt; what had happened.&lt;/p&gt;\r\n&lt;p&gt;Some Amazon
        security researchers had found that you could prompt Fable to \"review the
        code for security issues\" and it would refuse... but if you prompted it to
        \"fix this code\" it would still identify and then patch the problems.&lt;/p&gt;\r\n&lt;p&gt;\"Fix
        this code\" was the prompt that got Fable shut down!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.046.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.046.webp\"
        alt=\"Screenshot of a page from a report showing a list of weird account names
        making weird edits to a German wiki.\" style=\"max-width: 100%\" /&gt;\r\n
        \ &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.046.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Also, in June, an obscure German-language game developer wiki that
        had sat fallow for around 20 years got a surprising influx of edits from accounts
        with names like \"AgentOpenAIProbe\" and \"AgentOpenAISep7\", editing pages
        and leaving weird messages to each other.&lt;/p&gt;\r\n&lt;p&gt;We'll stick
        that on the pile of mysteries for later.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.047.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.047.webp\"
        alt=\"Medicare Item Reports interface on the Australian Government&amp;#39;s
        Medicare Statistics website.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.047.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Also, the Australian government's Medicare Item Reports service
        started getting suspicious traffic, which broke through various preventive
        protections and accessed data that it wasn't supposed to.&lt;/p&gt;\r\n&lt;p&gt;Another
        one for the mystery pile!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.048.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.048.webp\"
        alt=\"July\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.048.webp\"&gt;#&lt;/a&gt;\r\n
        \ \r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.049.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.049.webp\"
        alt=\"Fable returned on 1st July\r\nGPT-5.6 came out on 9th July |\r\nFable
        lost 18 out of 30 days in the top spot\r\n\" style=\"max-width: 100%\" /&gt;\r\n
        \ &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.049.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Fable returned on the first of July. It was clearly the best model
        in the world for a glorious eight days... and then OpenAI came out with GPT-5.6
        on the 9th of July.&lt;/p&gt;\r\n&lt;p&gt;This might not have been quite as
        good as Fable, but it was within spitting distance. It was definitely a Fable
        class model.&lt;/p&gt;\r\n&lt;p&gt;This is an important lesson for the industry
        at large.&lt;/p&gt;\r\n&lt;p&gt;When you release the best model in the world,
        it's going to get knocked off that pedestal pretty quickly. The competition
        is so fierce that you won't get a long time at the top.&lt;/p&gt;\r\n&lt;p&gt;This
        means that if you market your model as world ending, to the point that a government
        &lt;em&gt;shuts you down&lt;/em&gt;, it's really bad for business!&lt;/p&gt;\r\n&lt;p&gt;Fable
        had 30 days as definitely the best model, and for 18 of those days it wasn't
        available because it'd been shut down by the government.&lt;/p&gt;\r\n&lt;p&gt;So
        maybe step back on the world-ending marketing if you don't want to lose revenue
        for 60% of the time that you're on top!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.050.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.050.webp\"
        alt=\"GPT-5.6 Pelicans in a grid showing 5.6 Sol, Terra, and Luna against
        reasoning levels High, XHigh, and Max. They are all pretty good efforts.\"
        style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right;
        text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.050.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Here &lt;a href=\"https://simonwillison.net/2026/Jul/9/gpt-5-6/\"&gt;are
        the GPT-5.6 pelicans&lt;/a&gt;. They're all pretty good now! The Luna ones
        are notable because they're really cheap - the cheapest good looking pelican
        here is probably the one that costs 4.3 cents.&lt;/p&gt;\r\n&lt;p&gt;So despite
        this benchmark being utterly stupid, you can still learn quite a lot about
        models within the same family by comparing their prices and timing for different
        reasoning levels.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.051.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.051.webp\"
        alt=\"July 18th: malicious miflow-ui PyPI package\r\n\r\nScreenshot of an
        OSV security report.\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.051.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Also in July: some malicious unknown party uploaded &lt;a href=\"https://osv.dev/vulnerability/MAL-2026-10779\"&gt;a
        malicious package called mlflow-ui&lt;/a&gt; to the Python Package Index.
        Add that to the pile.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.052.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.052.webp\"
        alt=\"Hugging Face\r\nSecurity incident disclosure \u2014 July 2026\r\nPublished
        July 16, 2026\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.052.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;On July the 16th, Hugging Face &lt;a href=\"https://huggingface.co/blog/security-incident-july-2026\"&gt;announced
        a security incident&lt;/a&gt; where an autonomous agent system, source unknown,
        had breached Hugging Face and was poking around in places it shouldn't.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.053.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.053.webp\"
        alt=\"OpenAI: OpenAl and Hugging Face\r\npartner to address security\r\nincident
        during model evaluation\r\n\r\nAnthropic: Investigating three real-world incidents\r\nin
        our cybersecurity evaluations\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.053.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;A few days later, on July 21st, OpenAI &lt;a href=\"https://openai.com/index/hugging-face-model-evaluation-security-incident/\"&gt;confessed
        that it was them&lt;/a&gt;.&lt;/p&gt;\r\n&lt;p&gt;OpenAI use a training technique
        called Reinforcement Learning from Verifiable Rewards - it's the same technique
        used by everyone else now, and is the reason we have models that are so good
        at coding, and mathematics, and finding security holes.&lt;/p&gt;\r\n&lt;p&gt;While
        the model is being trained, you run exercises to see how good it is - and
        the strongest performers get their weights reinforced for the next round.
        It's like an evolutionary process that you run.&lt;/p&gt;\r\n&lt;p&gt;OpenAI
        had been running security exercises in a sandbox, and those agents had found
        holes in the sandbox itself, broken out, and were attacking Hugging Face to
        try to find ways to solve otherwise impossible problems.&lt;/p&gt;\r\n&lt;p&gt;(I've
        been collecting more about this on my &lt;a href=\"https://simonwillison.net/tags/openai-hugging-face-incident/\"&gt;openai-hugging-face-incident&lt;/a&gt;
        tag.)&lt;/p&gt;\r\n&lt;p&gt;Nine days later, Anthropic effectively said \"our
        models can do this as well!\". They had looked through their own training
        logs and found evidence that their own agents had broken containment during
        training - and were responsible for the PyPI package we saw earlier, &lt;a
        href=\"https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals\"&gt;among
        other things&lt;/a&gt;.&lt;/p&gt;\r\n&lt;p&gt;So now we've got both Anthropic
        and OpenAI with rogue agents running around the internet doing things that
        they &lt;em&gt;should not&lt;/em&gt; be doing.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.054.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.054.webp\"
        alt=\"August\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.054.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;In August, I got one of my best pelicans yet. And it was generated
        on my laptop!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\"
        id=\"simon-willison-2026-in-llms.055.webp\"&gt;\r\n  &lt;img loading=\"lazy\"
        src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.055.webp\"
        alt=\"Qwen 3.8 27B - 17GB, 21 minutes...\r\n\r\nIt&amp;#39;s really good.
        Beautiful pelican. Correctly shaped bicycle. Legs either side of the frame.\"
        style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right;
        text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.055.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;This was Qwen 3.8 27B, &lt;a href=\"https://simonwillison.net/2026/Aug/16/qwen-38-27b/\"&gt;running
        on my laptop&lt;/a&gt;. It's only a 17GB download.&lt;/p&gt;\r\n&lt;p&gt;Admittedly,
        this pelican took &lt;em&gt;21 minutes&lt;/em&gt; to generate. That's because
        Qwen 3.8 27B defaults to running in \"high\" reasoning mode - a terrible default
        which produces great results but takes way too much time thinking about them.&lt;/p&gt;\r\n&lt;p&gt;You
        can dial that down and you'll get a slightly worse pelican a lot faster.&lt;/p&gt;\r\n&lt;p&gt;Qwen
        3.8 27B was the first time I ran a model on my laptop which felt almost competitive
        with what was going on on the frontier, at least in terms of Pelican SVGs
        (which everyone needs, of course).&lt;/p&gt;\r\n&lt;p&gt;This is an extraordinary
        model. If you're going to play with any local model, this is the one that
        I'd start with. The things that this can do with just a 17 GB file feel impossible.&lt;/p&gt;\r\n&lt;p&gt;I
        thought I'd have to wait five years and spend ten thousand dollars on hardware
        to get results even half as good as this one.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.056.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.056.webp\"
        alt=\"Tweet by @simonw\r\nNew hobby: prototyping video games in 60 seconds
        using a combination\r\nof GPT-3 and DALL-E\r\nHere&amp;#39;s &amp;quot;Raccoon
        Heist&amp;quot;\r\n\r\nGPT-3 playground prompt:\r\nWrite a detailed product
        description of a\r\ncomputer game where a team of raccoons go on\r\nheists\r\n\r\nGPT-3
        response:\r\nIn &amp;quot;Raccoon Heist&amp;quot;, you and your team of thieving
        ~~ o\r\nraccoons are tasked with pulling off a series of \r\ndaring heists.
        From robbing banks to stealing \r\npriceless art, no job is too big or too
        small for your \r\nfurry crew. You&amp;#39;ll need to use your wits and your\r\nskills
        to avoid the police and make a clean\r\ngetaway with the loot. With exciting
        gameplay and\r\na charming cast of characters, &amp;quot;Raccoon Heist&amp;quot;
        is\r\nthe perfect game for anyone looking for a light-hearted caper\r\n\r\nPlus
        an image of some almost isometric raccoons sneaking past a bin.\r\n11:45 AM
        - Aug 5, 2022\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.056.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;In August, I also started playing with game development.&lt;/p&gt;\r\n&lt;p&gt;Four
        years ago, back in August 2022, I &lt;a href=\"https://twitter.com/simonw/status/1555626060384911360\"&gt;tweeted
        out&lt;/a&gt; an experiment where I'd used GPT-3 and the original DALL-E to
        write a paragraph long description of a computer game and then turn that into
        concept art.&lt;/p&gt;\r\n&lt;p&gt;My prompt to GPT-3 back then was:&lt;/p&gt;\r\n&lt;blockquote&gt;\r\n&lt;p&gt;&lt;code&gt;Write
        a detailed product description of a computer game where a team of raccoons
        go on heists&lt;/code&gt;&lt;/p&gt;\r\n&lt;/blockquote&gt;\r\n&lt;p&gt;In
        August 2026 I decided to drop just the screenshots from that tweet into a
        coding agent and see what it could do with them.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.057.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.057.webp\"
        alt=\"Night 5 Clear\r\n\r\nRank: TRASH PANDA\r\nThe crew banked 595 in shiny
        loot (goal 560).\r\nWord on the street: an even bigger score tomorrow...\"
        style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right;
        text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.057.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Here's &lt;a href=\"https://simonwillison.net/2026/Aug/5/raccoon-heist/\"&gt;what
        I got from Claude Fable 5 in Claude Code&lt;/a&gt;. It's pretty good! It's
        definitely a game, you're a raccoon, you run around a backyard gathering treasure
        and avoiding guards with flashlights.&lt;/p&gt;\r\n&lt;p&gt;It didn't feel
        very \"heisty\" though. I was thinking a heist would involve a bank or a museum...&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.058.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.058.webp\"
        alt=\"Moonlight &amp;amp; Mayhem\r\nOne museum. Three raccoons. Absolutely
        no plan\r\n\r\nStart the Heist button.\" style=\"max-width: 100%\" /&gt;\r\n
        \ &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.058.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Then I tried the same thing &lt;a href=\"https://simonwillison.net/2026/Aug/7/moonlight-mayhem/\"&gt;in
        Codex Desktop using GPT-5.6 Sol Ultra&lt;/a&gt;, and got a &lt;em&gt;massively&lt;/em&gt;
        better result. Now you're a raccoon in a museum, rescuing two of your fellow
        raccoons (who have been imprisoned in that museum for some reason), then stacking
        up on top of each other to steal the Golden Sardine. Much more of a heist!&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.059.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.059.webp\"
        alt=\"They look like games,\r\nbut are they fun?\r\n\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.059.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;These games were fun for about one minute and 15 seconds.&lt;/p&gt;\r\n&lt;p&gt;Something
        I've realized about game development is that you can vibe-code something that
        &lt;em&gt;looks&lt;/em&gt; like a computer game, and that's easy.&lt;/p&gt;\r\n&lt;p&gt;Building
        a game that's fun, has a good gameplay loop, and is challenging and interesting
        and keeps people coming back for more... that's still beyond me, and beyond
        any of the agents I've tried.&lt;/p&gt;\r\n&lt;p&gt;This ties into the Deep
        Blue thing. Just because we can make something that &lt;em&gt;looks like a
        game&lt;/em&gt; does not mean that we are game developers.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.060.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.060.webp\"
        alt=\"September\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.060.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;We're into September now. So much has happened this month!&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.061.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.061.webp\"
        alt=\"Discovery of a new OpenAl agent message board\r\n\r\nSydney Von Arx,
        Cormac Slade Byrd, Spencer KittsThomas Larsen - 4 September 2026\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.061.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;An &lt;a href=\"https://collusion.wiki\"&gt;independent group of
        researchers&lt;/a&gt; found a message board where OpenAI agents-in-training
        had been illicitly communicating with each other... and it was that German
        language wiki I showed you earlier. The one from June.&lt;/p&gt;\r\n&lt;p&gt;I
        &lt;a href=\"https://simonwillison.net/2026/Sep/4/rogue-agent-wikis/\"&gt;wrote
        more about that here&lt;/a&gt;.&lt;/p&gt;\r\n&lt;p&gt;OpenAI had confessed
        to the Hugging Face thing, but now there's this other incident which surely
        they should have known about from reviewing their logs. It was surprising
        that this took an independent group of researchers to uncover.&lt;/p&gt;\r\n
        \ &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\" id=\"simon-willison-2026-in-llms.062.webp\"&gt;\r\n
        \ &lt;img loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.062.webp\"
        alt=\"OpenAl agents carried out an undisclosed cyber-attack on RubyGems\r\n\r\nSpencer
        Kitts, Thomas Larsen, Sydney Von Arx - 11 September 2026\" style=\"max-width:
        100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right; text-decoration:
        none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.062.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;And then a week later &lt;a href=\"https://rubyhack.ai\"&gt;those
        same researchers found&lt;/a&gt; that the attack on RubyGems back in May was
        caused by OpenAI's agents in training as well!&lt;/p&gt;\r\n&lt;p&gt;At this
        point I'm wondering how many more incidents like this there are that we haven't
        found yet. Clearly this was a big problem for months before anyone figured
        out what was going on.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.063.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.063.webp\"
        alt=\"Headline: Australian PM warns in UN speech about the \u2018furious pace\u2019
        of Al\r\nafter security breach\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.063.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Then &lt;a href=\"https://www.politico.com/news/2026/09/24/australian-pm-ai-security-breach-01093083\"&gt;just
        the other day&lt;/a&gt;, here's the Prime Minister of Australia at the United
        Nations General Assembly warning that OpenAI had hacked the Australian healthcare
        website that I showed you earlier.&lt;/p&gt;\r\n&lt;p&gt;I think that was
        part of the same training run as the Wiki stuff, because there were posts
        on that Wiki mentioning &lt;code&gt;.gov.au&lt;/code&gt; websites and that
        training appeared to involve researching statistics online to answer questions
        in an evaluation suite.&lt;/p&gt;\r\n&lt;p&gt;This story is still coming together,
        but now it's an international incident that's been raised at the UN by a head
        of state!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div class=\"slide\"
        id=\"simon-willison-2026-in-llms.064.webp\"&gt;\r\n  &lt;img loading=\"lazy\"
        src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.064.webp\"
        alt=\"www.felonybench.com\r\n\r\nOpenAI: 11\r\nAnthropic: 9\r\nGoogle: 3\r\nMeta:
        1\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right;
        text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.064.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;This does mean we've got a new benchmark, probably more useful
        than my pelicans.&lt;/p&gt;\r\n&lt;p&gt;&lt;a href=\"https://www.felonybench.com/\"&gt;FelonyBench.com&lt;/a&gt;
        tracks the number of felony cyberattacks from different labs. OpenAI currently
        lead with 11, Anthropic have 9. Google have three, which &lt;a href=\"https://simonwillison.net/2026/Sep/18/gemini-hacked-three-companies/\"&gt;they
        confessed to the Wall Street Journal&lt;/a&gt; a couple of weeks ago. They
        said they had previously chosen not to disclose because the agents had stopped
        when they realized that they shouldn't be doing that.&lt;/p&gt;\r\n&lt;p&gt;Meta
        &lt;a href=\"https://simonwillison.net/2026/Aug/6/an-ai-model-from-meta/\"&gt;have
        one too&lt;/a&gt;. So felonies all round for the AI labs.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.065.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.065.webp\"
        alt=\"Pelicans for GPT-6 Astra, GPT-6 Sol, and GPT-6 Luna. All are good, all
        have the same color scheme.\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.065.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Here's our current state of the art for the pelicans. This is the
        GPT-6 family, which &lt;a href=\"https://simonwillison.net/2026/Sep/22/opus-and-sol-and-luna/\"&gt;just
        came out&lt;/a&gt;.&lt;/p&gt;\r\n&lt;p&gt;Astra made a fantastic pelican riding
        a bicycle. It's got the legs on both sides. The frame is good.&lt;/p&gt;\r\n&lt;p&gt;It's
        interesting how all of the GPT-6 models pick a similar color scheme to each
        other. &lt;/p&gt;\r\n&lt;p&gt;GPT-6 Luna for 0.4 cents will draw you a competent-ish
        pelican riding a bicycle!&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.066.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.066.webp\"
        alt=\"Grid for Claude Fable 5.1, Opus 5.5, OPus 5, Sonnet 5. The Sonnet pelicans
        are terrible. All of the others are pretty good. Opus 5.5 is missing its Max
        level pelican because it ran out of tokens. The best is Fable 5.1 at Max.\"
        style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float: right;
        text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.066.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Claude has caught up a little bit. Claude Fable 5.1 gave me an
        &lt;em&gt;excellent&lt;/em&gt; pelican riding a bicycle - the best I've seen
        from a Claude model - but did charge me $3.30 for it.&lt;/p&gt;\r\n&lt;p&gt;Opus
        5.5 &lt;a href=\"https://simonwillison.net/2026/Sep/22/opus-and-sol-and-luna/#claude-opus-5-5-max-over-thinks-to-the-point-of-breaking\"&gt;thought
        for 128,000 tokens&lt;/a&gt; and then gave up! It ran out of tokens before
        it got to the response.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.067.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.067.webp\"
        alt=\"It doesn\u2019t get easier -\r\nyou just get faster\r\nGreg LeMond\r\n3x
        Tour de France champion\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a
        style=\"float: right; text-decoration: none; border-bottom: none; padding-left:
        1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.067.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;Getting back to Deep Blue. Something that's been puzzling me this
        year is this: &lt;em&gt;why does my job feel harder?&lt;/em&gt;&lt;/p&gt;\r\n&lt;p&gt;I've
        got these agents that can do all of this stuff for me, and yet I've never
        worked so hard, I've never been so intellectually engaged with my work.&lt;/p&gt;\r\n&lt;p&gt;Partly
        this is because I'm being a lot more ambitious with what I take on, but it's
        also because all of the easy stuff is handled for me. If it's easy, the agent
        will do it. Everything that's left for me is difficult.&lt;/p&gt;\r\n&lt;p&gt;This
        morning &lt;a href=\"https://twitter.com/hillelogram/status/2103482784606040229\"&gt;I
        heard&lt;/a&gt; this quote from three-time Tour de France champion &lt;a href=\"https://en.wikipedia.org/wiki/Greg_LeMond\"&gt;Greg
        LeMond&lt;/a&gt;:&lt;/p&gt;\r\n&lt;blockquote&gt;\r\n&lt;p&gt;It doesn't get
        easier, you just get faster.&lt;/p&gt;\r\n&lt;/blockquote&gt;\r\n&lt;p&gt;I
        think that's exactly what's happening to us now as software engineers with
        coding agents.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.068.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.068.webp\"
        alt=\"Kakapo population reaches new milestone\r\nThe official population of
        the critically endangered kakapo has\r\nreached a recovery-era high of 325
        birds.\r\n\" style=\"max-width: 100%\" /&gt;\r\n  &lt;div&gt;&lt;a style=\"float:
        right; text-decoration: none; border-bottom: none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.068.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;One closing thing. I know you're desperate for an update on K\u0101k\u0101p\u014D
        breeding season.&lt;/p&gt;\r\n&lt;p&gt;&lt;a href=\"https://www.doc.govt.nz/news/media-releases/2026-media-releases/kakapo-population-reaches-new-milestone/\"&gt;We've
        reached a recovery-era high of 325 birds&lt;/a&gt;!&lt;/p&gt;\r\n&lt;p&gt;89
        new chicks have made it to this point. This is the best breeding year in a
        very long time.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n&lt;div
        class=\"slide\" id=\"simon-willison-2026-in-llms.069.webp\"&gt;\r\n  &lt;img
        loading=\"lazy\" src=\"https://static.simonwillison.net/static/2026/2026-in-llms/simon-willison-2026-in-llms-png.069.webp\"
        alt=\"Kakapo party, click for confetti.\" style=\"max-width: 100%\" /&gt;\r\n
        \ &lt;div&gt;&lt;a style=\"float: right; text-decoration: none; border-bottom:
        none; padding-left: 1em;\" href=\"https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/#simon-willison-2026-in-llms.069.webp\"&gt;#&lt;/a&gt;\r\n
        \ &lt;p&gt;I heard that Claude Opus 5.5 can now do pixel art. Claude doesn't
        have an image generator, but it's very good at using JavaScript to draw animated
        pixels.&lt;/p&gt;\r\n&lt;p&gt;So I had it &lt;a href=\"https://simonwillison.net/2026/Sep/26/kakapo-party/\"&gt;make
        me a K\u0101k\u0101p\u014D dance party&lt;/a&gt;. I think this is a good celebration
        of the most important news of this year.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/div&gt;\n
        \   \n        &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/ai\"&gt;ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/generative-ai\"&gt;generative-ai&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/llms\"&gt;llms&lt;/a&gt;, &lt;a
        href=\"https://simonwillison.net/tags/annotated-talks\"&gt;annotated-talks&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai-security-research\"&gt;ai-security-research&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/openai-hugging-face-incident\"&gt;openai-hugging-face-incident&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"ai\"/><category term=\"generative-ai\"/><category
        term=\"llms\"/><category term=\"annotated-talks\"/><category term=\"ai-security-research\"/><category
        term=\"openai-hugging-face-incident\"/></entry><entry><title>S3 Is the Future,
        S3 Is the Past</title><link href=\"https://simonwillison.net/2026/Sep/27/hn-49871741/\"
        rel=\"alternate\"/><published>2026-09-27T23:09:19+00:00</published><updated>2026-09-27T23:09:19+00:00</updated><id>https://simonwillison.net/2026/Sep/27/hn-49871741/</id><summary
        type=\"html\">\n    \n        &lt;p&gt;&lt;a href=\"https://news.ycombinator.com/item?id=49851693#49871741\"&gt;My
        comment&lt;/a&gt; on &lt;a href=\"https://news.ycombinator.com/item?id=49851693\"&gt;S3
        Is the Future, S3 Is the Past&lt;/a&gt; &amp;mdash; Hacker News.&lt;/p&gt;&lt;p&gt;One
        thing I find notable about S3 today is that, while it used to drop in price
        reasonably often, there hasn't been a price drop in &lt;em&gt;a full decade&lt;/em&gt;:&lt;/p&gt;\n&lt;pre&gt;&lt;code&gt;2006-03-14
        \ $0.150/GB-month\n2010-11-01  $0.140/GB-month\n2012-02-01  $0.125/GB-month\n2012-12-01
        \ $0.095/GB-month\n2014-02-01  $0.085/GB-month\n2014-04-01  $0.030/GB-month\n2016-12-01
        \ $0.023/GB-month\n&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;Today it's still $0.023/GB-month.&lt;/p&gt;\n
        \   \n    \n        &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/amazon-web-services\"&gt;amazon-web-services&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/s3\"&gt;s3&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"amazon-web-services\"/><category term=\"s3\"/></entry><entry><title>Bluesky
        reply bot checker</title><link href=\"https://simonwillison.net/2026/Sep/27/bluesky-bot-check/\"
        rel=\"alternate\"/><published>2026-09-27T18:41:44+00:00</published><updated>2026-09-27T18:41:44+00:00</updated><id>https://simonwillison.net/2026/Sep/27/bluesky-bot-check/</id><summary
        type=\"html\">\n    \n        &lt;p&gt;&lt;strong&gt;Tool:&lt;/strong&gt;
        &lt;a href=\"https://tools.simonwillison.net/bluesky-bot-check\"&gt;Bluesky
        reply bot checker&lt;/a&gt;&lt;/p&gt;\n        &lt;p&gt;Automated reply bots
        on Twitter are a &lt;em&gt;scourge&lt;/em&gt; - as someone with a decent number
        of followers I attract a swarm of these, such that anything I post there attracts
        dozens of mindless automated replies.&lt;/p&gt;\n&lt;p&gt;They've started
        manifesting on Bluesky as well.&lt;/p&gt;\n&lt;p&gt;Unlike Twitter, Bluesky
        still has a freely available and useful API. The lack of such a thing doesn't
        slow down the bots, but it does make investigating them a lot more frustrating.&lt;/p&gt;\n&lt;p&gt;So
        I had Opus 5.5 &lt;a href=\"https://github.com/simonw/tools/pull/348\"&gt;vibe
        code this tool&lt;/a&gt;, which examines any Bluesky profile for evidence
        of a likely reply bot.&lt;/p&gt;\n&lt;p&gt;It looks for signals like replies
        posted within seconds of other posts from the same account, or accounts that
        never post their own content (or images or links) but instead consistently
        reply to messages from other, higher-follower users.&lt;/p&gt;\n&lt;p&gt;It
        also looks for question marks, because I'm &lt;em&gt;extra&lt;/em&gt; infuriated
        by reply bots that trick me into wasting my time answering a question that
        no human ever posed.&lt;/p&gt;\n    \n    \n        &lt;p&gt;Tags: &lt;a href=\"https://simonwillison.net/tags/twitter\"&gt;twitter&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/bluesky\"&gt;bluesky&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/vibe-coding\"&gt;vibe-coding&lt;/a&gt;,
        &lt;a href=\"https://simonwillison.net/tags/ai-misuse\"&gt;ai-misuse&lt;/a&gt;&lt;/p&gt;\n
        \   \n\n</summary><category term=\"twitter\"/><category term=\"bluesky\"/><category
        term=\"vibe-coding\"/><category term=\"ai-misuse\"/></entry></feed>"
